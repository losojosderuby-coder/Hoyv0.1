function missionFolderOptions(pid,selected=''){return `<option value="" ${!selected?'selected':''}>📂 General (sin carpeta)</option>${projectMissionFolders(pid).map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>📁 ${safe(f.name)}</option>`).join('')}`}
function newMission(pid){modal(`<h2>Nueva misión</h2><label>Nombre</label><input id="mName" placeholder="Ej. Canción, Video, Lanzamiento"><label>Descripción</label><textarea id="mDesc" placeholder="¿Qué abarca esta misión?"></textarea><label>Carpeta</label><select id="mFolder">${missionFolderOptions(pid)}</select><label>Prioridad</label><select id="mPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><div class="actions"><button class="btn" onclick="saveMission('${pid}')">Crear misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveMission(pid){const name=document.getElementById('mName').value.trim();if(!name)return alert('Escribí un nombre.');const m={id:uid(),projectId:pid,name,description:document.getElementById('mDesc').value.trim(),folderId:document.getElementById('mFolder').value||null,priority:document.getElementById('mPriority').value,order:data.missions.filter(x=>x.projectId===pid&&!(x.completedAt||x.done)).length,created:Date.now()};data.missions.push(m);save();closeModal();openProject(pid)}
function editMission(mid){const m=mission(mid);modal(`<h2>Editar misión</h2><label>Nombre</label><input id="emName" value="${safe(m.name)}"><label>Descripción</label><textarea id="emDesc">${safe(m.description||'')}</textarea><label>Carpeta</label><select id="emFolder">${missionFolderOptions(m.projectId,m.folderId||'')}</select><label>Prioridad</label><select id="emPriority"><option ${m.priority==='Alta'?'selected':''}>Alta</option><option ${(!m.priority||m.priority==='Media')?'selected':''}>Media</option><option ${m.priority==='Baja'?'selected':''}>Baja</option></select><div class="actions"><button class="btn" onclick="updateMission('${mid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateMission(mid){const m=mission(mid);m.name=document.getElementById('emName').value.trim()||m.name;m.description=document.getElementById('emDesc').value;m.folderId=document.getElementById('emFolder').value||null;m.priority=document.getElementById('emPriority').value;save();closeModal();openProject(m.projectId)}
function newTask(pid,mid=''){const folders=(data.missionFolders||[]).filter(f=>f.missionId===mid);modal(`<h2>Nueva tarea de la misión</h2><label>Tarea de la misión</label><input id="tTitle" placeholder="¿Qué hay que hacer?"><label>Prioridad</label><select id="tPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><label>Subtareas (una por línea, opcional)</label><textarea id="tSubs" placeholder="Primer paso&#10;Segundo paso&#10;Tercer paso"></textarea><div class="actions"><button class="btn" onclick="saveTask('${pid}','${mid}')">Guardar tarea de la misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTask(pid,mid=''){const title=document.getElementById('tTitle').value.trim();if(!title)return alert('Escribí una tarea.');const subtasks=document.getElementById('tSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:false}));data.tasks.push({id:uid(),projectId:pid,missionId:mid||null,folderId:document.getElementById('tFolder')?.value||null,title,priority:document.getElementById('tPriority').value,subtasks,done:false,created:Date.now()});save();closeModal();mid?openMission(mid):openProject(pid)}

function editCore(k){const color=data.coreColors?.[k]||defaultCoreColor(k);modal(`<h2>Editar núcleo</h2><label>Nombre</label><input id="cName" value="${safe(coreName(k))}"><label>Descripción</label><input id="cDesc" value="${safe(coreDesc(k))}"><label>Color del bloque</label><input id="cColor" type="color" value="${color}"><div class="actions"><button class="btn" onclick="saveCore('${k}')">Guardar cambios</button><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`)}
function saveCore(k){if(!data.coreNames)data.coreNames={};if(!data.coreDescs)data.coreDescs={};if(!data.coreIcons)data.coreIcons={};if(!data.coreColors)data.coreColors={};data.coreNames[k]=document.getElementById('cName').value.trim()||coreName(k);data.coreDescs[k]=document.getElementById('cDesc').value.trim();data.coreIcons[k]='';data.coreColors[k]=document.getElementById('cColor').value||defaultCoreColor(k);save();closeModal();if(tab==='core')renderCore();else render()}

function editTask(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;modal(`<h2>Editar tarea de la misión</h2><label>Nombre</label><input id="etTitle" value="${safe(t.title)}"><label>Carpeta</label><select id="etFolder"><option value="">Sin carpeta</option>${(data.missionFolders||[]).filter(f=>f.missionId===t.missionId).map(f=>`<option value="${f.id}" ${t.folderId===f.id?'selected':''}>📁 ${safe(f.name)}</option>`).join('')}</select><label>Prioridad</label><select id="etPriority"><option ${t.priority==='Baja'?'selected':''}>Baja</option><option ${t.priority==='Media'?'selected':''}>Media</option><option ${t.priority==='Alta'?'selected':''}>Alta</option></select><label>Subtareas (una por línea)</label><textarea id="etSubs">${(t.subtasks||[]).map(s=>safe(s.title)).join('\n')}</textarea><div class="actions"><button class="btn" onclick="saveTaskEdit('${tid}')">Guardar cambios</button><button class="btn danger" onclick="deleteTask('${tid}')">Eliminar tarea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTaskEdit(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;t.title=document.getElementById('etTitle').value.trim()||t.title;t.priority=document.getElementById('etPriority').value;t.folderId=document.getElementById('etFolder')?.value||null;const previous=t.subtasks||[];t.subtasks=document.getElementById('etSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:previous.find(s=>s.title===title)?.done||false}));if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function deleteTask(tid){if(!confirm('¿Eliminar esta tarea y sus subtareas?'))return;const t=data.tasks.find(x=>x.id===tid);data.tasks=data.tasks.filter(x=>x.id!==tid);if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function toggleSubtask(tid,index){const t=data.tasks.find(x=>x.id===tid);if(!t||!t.subtasks||!t.subtasks[index])return;t.subtasks[index].done=!t.subtasks[index].done;if(t.missionId){const m=mission(t.missionId);if(m)m.lastActivityAt=Date.now()}if(!save())return;if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}

function addCompletionEvent(kind,action,label){if(!Array.isArray(data.completionEvents))data.completionEvents=[];data.completionEvents.push({id:uid(),kind,action,label,at:Date.now()});}
function deleteCompletionEvent(id){if(!confirm('¿Eliminar este registro del historial? La misión o tarea conservará su estado.'))return;data.completionEvents=(data.completionEvents||[]).filter(e=>e.id!==id);if(!save())return;render()}
function clearCompletionLog(){if(!confirm('¿Borrar todo el registro de finalizaciones? Esto no modificará el estado de misiones, tareas ni proyectos.'))return;data.completionEvents=[];if(!save())return;render()}
function toggleMissionComplete(mid){const m=mission(mid);if(!m)return;const reopening=!!(m.completedAt||m.done);if(reopening){m.completedAt=null;m.done=false;addCompletionEvent('mission','reopened',m.name)}else{m.completedAt=Date.now();m.done=true;m.doneAt=Date.now();addCompletionEvent('mission','completed',m.name)}if(!save())return;if(!reopening)celebrate('mission');openMission(mid)}
function toggleProjectComplete(pid){const p=project(pid);if(!p)return;const reopening=!!p.completedAt;if(reopening){p.completedAt=null;p.archived=false;addCompletionEvent('project','reopened',p.name);if(!save())return;openProject(pid)}else{if(!confirm('¿Finalizar y archivar este proyecto? Lo vas a encontrar en Historial → Proyectos terminados.'))return;p.completedAt=Date.now();p.archived=true;addCompletionEvent('project','completed',p.name);if(data.lastMovement?.projectId===pid)data.lastMovement=null;if(!save())return;tab='history';render();celebrate('project')}}
function toggleTask(tid){const t=data.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;t.completedAt=t.done?Date.now():null;if(t.missionId){const m=mission(t.missionId);if(m)m.lastActivityAt=Date.now()}addCompletionEvent('task',t.done?'completed':'reopened',t.title);if(!save())return;if(t.done)celebrate('task');if(currentMission)openMission(currentMission);else if(currentProject)openProject(currentProject);else render()}}
function celebrate(kind){document.body.classList.remove('celebrate-'+kind);void document.body.offsetWidth;document.body.classList.add('celebrate-'+kind);setTimeout(()=>document.body.classList.remove('celebrate-'+kind),850)}
function startSession(pid,mid=''){
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 modal(`<p class="eyebrow">${cname(p.core)} / ${safe(p.name)}${m?' / '+safe(m.name):''}</p><h2>Registrar sesión</h2><p class="muted">Anotá el avance. El borrador se guarda automáticamente; podés volver después.</p><label>¿Qué hiciste?</label><textarea id="sDone" placeholder="Avances realizados..."></textarea><label>¿Cuál es el próximo paso?</label><textarea id="sNext" placeholder="La acción concreta para continuar..."></textarea><p class="small">● Guardado automático activado</p><div class="actions"><button class="btn" onclick="saveSession('${pid}','${mid}')">Guardar sesión</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields(key,['sDone','sNext']);
}
function saveSession(pid,mid=''){
 const done=document.getElementById('sDone').value.trim(),next=document.getElementById('sNext').value.trim();
 if(!done&&!next)return alert('Registrá al menos un dato.');
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 data.sessions.push({id:uid(),projectId:pid,missionId:mid||null,core:p.core,done,where:'',next,at:Date.now()});
 if(m)m.lastActivityAt=Date.now();
 p.last=done;p.next=next;p.lastAt=Date.now();
 if(!save())return;
 clearDraft(key);closeModal();mid?openMission(mid):openProject(pid);
}
function archiveProject(pid){if(!confirm('¿Archivar este proyecto? Podrás restaurarlo desde Historial.'))return;const p=project(pid);p.archived=true;if(data.lastMovement?.projectId===pid){const fallback=data.projects.filter(x=>!x.archived&&x.lastAt).sort((a,b)=>b.lastAt-a.lastAt)[0];data.lastMovement=fallback?{core:fallback.core,projectId:fallback.id,at:fallback.lastAt}:null}save();showCore(p.core)}
function restoreProject(pid){project(pid).archived=false;save();render()}
function deleteProject(pid){const p=project(pid);if(!p||!confirm('¿Eliminar definitivamente este proyecto, sus misiones, tareas y sesiones?'))return;const mids=data.missions.filter(m=>m.projectId===pid).map(m=>m.id);data.projects=data.projects.filter(x=>x.id!==pid);const removedMissionIds=data.missions.filter(m=>m.projectId===pid).map(m=>m.id);data.missions=data.missions.filter(m=>m.projectId!==pid);data.missionFolders=(data.missionFolders||[]).filter(f=>!removedMissionIds.includes(f.missionId));data.tasks=data.tasks.filter(t=>t.projectId!==pid);data.sessions=data.sessions.filter(s=>s.projectId!==pid);if(data.lastMovement?.projectId===pid)data.lastMovement=null;save();closeModal();showCore(p.core)}
function deleteMission(mid){const m=mission(mid);if(!m||!confirm('¿Eliminar esta misión, sus tareas y sus sesiones?'))return;data.missions=data.missions.filter(x=>x.id!==mid);data.missionFolders=(data.missionFolders||[]).filter(f=>f.missionId!==mid);data.tasks=data.tasks.filter(t=>t.missionId!==mid);data.sessions=data.sessions.filter(s=>s.missionId!==mid);if(data.lastMovement?.missionId===mid)data.lastMovement={core:project(m.projectId)?.core,projectId:m.projectId,at:Date.now()};save();openProject(m.projectId)}
function deleteCore(k){const pids=data.projects.filter(p=>p.core===k).map(p=>p.id);if(!confirm('¿Eliminar definitivamente este núcleo y TODO su contenido: proyectos, misiones, tareas, ideas y sesiones? Esta acción no se puede deshacer.'))return;data.projects=data.projects.filter(p=>p.core!==k);data.missions=data.missions.filter(m=>!pids.includes(m.projectId));data.tasks=data.tasks.filter(t=>!pids.includes(t.projectId));data.sessions=data.sessions.filter(s=>s.core!==k&&!pids.includes(s.projectId));delete data.ideasByCore[k];data.deletedCores=[...new Set([...(data.deletedCores||[]),k])];if(data.coreNames)delete data.coreNames[k];if(data.coreDescs)delete data.coreDescs[k];if(data.coreIcons)delete data.coreIcons[k];if(data.coreColors)delete data.coreColors[k];if(data.lastMovement?.core===k)data.lastMovement=null;save();tab='cores';render()}
function moveIdea(id,source,core,delta){const arr=source==='core'?coreIdeas(core):data.notes;const sorted=arr.slice().sort((a,b)=>{const ao=Number.isFinite(a.manualOrder)?a.manualOrder:null,bo=Number.isFinite(b.manualOrder)?b.manualOrder:null;if(ao!==null||bo!==null){if(ao===null)return 1;if(bo===null)return -1;return ao-bo;}return (b.at||0)-(a.at||0)});const idx=sorted.findIndex(x=>x.id===id),next=idx+delta;if(idx<0||next<0||next>=sorted.length)return;const item=sorted[idx];sorted.splice(idx,1);sorted.splice(next,0,item);sorted.forEach((x,i)=>x.manualOrder=i);if(source==='core')data.ideasByCore[core]=sorted;else data.notes=sorted;if(!save())return;if(source==='core')openIdeas(core);else{tab='ideas';render()}}
function allIdeas(){const list=(data.notes||[]).map(i=>({...i,source:'note'}));Object.entries(data.ideasByCore||{}).forEach(([core,arr])=>(arr||[]).forEach(i=>{if(!list.some(x=>x.id===i.id))list.push({...i,core,source:'core'});}));return list.sort((a,b)=>{const ao=Number.isFinite(a.manualOrder)?a.manualOrder:null,bo=Number.isFinite(b.manualOrder)?b.manualOrder:null;if(ao!==null||bo!==null){if(ao===null)return 1;if(bo===null)return -1;return ao-bo;}return (b.at||0)-(a.at||0)});}
function ideasPage(){const list=allIdeas();return `<div class="headline"><div><p class="eyebrow">CAPTURA Y CREACIÓN</p><h1>Ideas 💡</h1><p class="muted">Guardá ideas ahora y convertílas en misiones cuando estés listo.</p></div><button class="btn" onclick="newGlobalIdea()">＋ Idea</button></div>${list.length?list.map(i=>`<div class="idea-list-card"><b>${safe(i.title||(i.at?'Idea · '+fmt(i.at):'Idea'))}</b><p>${safe(i.text)}</p><div class="idea-meta">${i.core?safe(coreName(i.core))+' · ':''}${i.at?fmt(i.at):''}</div><div class="idea-card-actions"><button class="btn secondary idea-convert" onclick="convertIdea('${i.id}','${i.source}','${i.core||''}')">Convertir en misión</button><div class="idea-reorder"><button class="edit-icon" onclick="moveIdea('${i.id}','${i.source}','${i.core||''}',-1)" aria-label="Subir idea" title="Subir">↑</button><button class="edit-icon" onclick="moveIdea('${i.id}','${i.source}','${i.core||''}',1)" aria-label="Bajar idea" title="Bajar">↓</button></div><button class="edit-icon idea-edit" onclick="editGlobalIdea('${i.id}','${i.source}','${i.core||''}')" aria-label="Editar idea" title="Editar">✎</button></div></div>`).join(''):'<div class="empty">Todavía no guardaste ideas. Tocá «Idea» para capturar la primera.</div>'}`;}
function newGlobalIdea(){modal(`<h2>Nueva idea</h2><label>Idea</label><textarea id="gIdeaText" placeholder="Anotá lo que se te ocurrió..."></textarea><label>Título</label><input id="gIdeaTitle" placeholder="Nombre breve"><label>Núcleo (opcional)</label><select id="gIdeaCore"><option value="">Sin clasificar</option>${activeCores().map(c=>`<option value="${c[0]}">${safe(coreName(c[0]))}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveGlobalIdea()">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);bindDraftFields('global-idea',['gIdeaTitle','gIdeaText','gIdeaCore']);}
function saveGlobalIdea(){const text=document.getElementById('gIdeaText').value.trim();if(!text)return alert('Escribí la idea.');data.notes.push({id:uid(),title:document.getElementById('gIdeaTitle').value.trim(),text,core:document.getElementById('gIdeaCore').value,at:Date.now()});if(!save())return;clearDraft('global-idea');closeModal();tab='ideas';render();}
function findIdea(id,source,core){return source==='core'?coreIdeas(core).find(x=>x.id===id):(data.notes||[]).find(x=>x.id===id)}
function editGlobalIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;modal(`<h2>Editar idea</h2><label>Idea</label><textarea id="gIdeaText">${safe(i.text)}</textarea><label>Título</label><input id="gIdeaTitle" value="${safe(i.title||'')}"><div class="actions"><button class="btn" onclick="updateGlobalIdea('${id}','${source}','${core}')">Guardar</button><button class="btn danger" onclick="deleteGlobalIdea('${id}','${source}','${core}')">Eliminar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateGlobalIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;i.title=document.getElementById('gIdeaTitle').value.trim();i.text=document.getElementById('gIdeaText').value.trim();save();closeModal();tab='ideas';render()}
function deleteGlobalIdea(id,source,core){if(!confirm('¿Eliminar esta idea?'))return;if(source==='core')data.ideasByCore[core]=coreIdeas(core).filter(x=>x.id!==id);else data.notes=data.notes.filter(x=>x.id!==id);save();render()}
function convertIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;const projects=data.projects.filter(p=>!p.archived);modal(`<h2>Convertir idea en misión</h2><label>Núcleo</label><select id="ideaCore" onchange="refreshIdeaProjects()">${activeCores().map(c=>`<option value="${c[0]}" ${core&&c[0]===core?'selected':''}>${safe(coreName(c[0]))}</option>`).join('')}</select><label>Proyecto donde querés crearla</label><select id="ideaProject">${projects.map(p=>`<option value="${p.id}" ${core&&p.core===core?'selected':''}>${safe(coreName(p.core))} · ${safe(p.name)}</option>`).join('')}</select><label>Nombre de la misión</label><input id="ideaMissionName" value="${safe(i.title||i.text.slice(0,55))}"><label>Descripción</label><textarea id="ideaMissionDesc">${safe(i.text)}</textarea><div class="actions"><button class="btn" onclick="createMissionFromIdea('${id}','${source}','${core}')">Crear misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);refreshIdeaProjects();}function refreshIdeaProjects(){const coreId=document.getElementById('ideaCore')?.value;const sel=document.getElementById('ideaProject');if(!sel)return;const list=data.projects.filter(p=>!p.archived&&p.core===coreId);sel.innerHTML=list.map(p=>`<option value="${p.id}">${safe(p.name)}</option>`).join('');if(!list.length)sel.innerHTML='<option value="">No hay proyectos en este núcleo</option>';}
function createMissionFromIdea(id,source,core){const pid=document.getElementById('ideaProject').value;if(!pid)return alert('Primero creá un proyecto.');const p=project(pid);const name=document.getElementById('ideaMissionName').value.trim();if(!name)return alert('Poné un nombre a la misión.');const order=data.missions.filter(m=>m.projectId===pid).length;data.missions.push({id:uid(),projectId:pid,name,description:document.getElementById('ideaMissionDesc').value.trim(),icon:'✦',order,created:Date.now()});const i=findIdea(id,source,core);if(i)i.convertedTo=pid;save();closeModal();tab='project';openProject(pid);}
function openIdeas(k){currentCore=k;touchCore(k);const ideas=coreIdeas(k);document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${k}')">← ${safe(coreName(k))}</button><div class="row between section-head"><div><p class="eyebrow">${safe(coreName(k))}</p><h1>Ideas</h1></div><span class="idea-bulb">💡</span></div><button class="btn" onclick="newCoreIdea('${k}')">＋ Nueva idea</button><div class="panel">${ideas.length?ideas.slice().sort((a,b)=>{const ao=Number.isFinite(a.manualOrder)?a.manualOrder:null,bo=Number.isFinite(b.manualOrder)?b.manualOrder:null;if(ao!==null||bo!==null){if(ao===null)return 1;if(bo===null)return -1;return ao-bo;}return b.at-a.at}).map(i=>`<div class="idea-card"><b>${safe(i.title||(i.at?'Idea · '+fmt(i.at):'Idea'))}</b><p>${safe(i.text)}</p><div class="small">${fmt(i.at)}</div><div class="idea-actions"><button class="edit-icon" onclick="moveIdea('${i.id}','core','${k}',-1)" aria-label="Subir idea">↑</button><button class="edit-icon" onclick="moveIdea('${i.id}','core','${k}',1)" aria-label="Bajar idea">↓</button><button class="edit-icon" onclick="editCoreIdea('${k}','${i.id}')" aria-label="Editar idea">✎</button></div></div>`).join(''):'<div class="empty">Todavía no hay ideas en este núcleo.</div>'}</div>`}
function newCoreIdea(k){modal(`<h2>Nueva idea</h2><label>Idea</label><textarea id="ideaText" placeholder="Desarrollá la idea..."></textarea><label>Título</label><input id="ideaTitle" placeholder="Nombre breve"><div class="actions"><button class="btn" onclick="saveCoreIdea('${k}')">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveCoreIdea(k){const text=document.getElementById('ideaText').value.trim();if(!text)return alert('Escribí la idea.');if(!data.ideasByCore[k])data.ideasByCore[k]=[];data.ideasByCore[k].push({id:uid(),title:document.getElementById('ideaTitle').value.trim(),text,at:Date.now()});save();closeModal();openIdeas(k)}
function editCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;modal(`<h2>Editar idea</h2><label>Idea</label><textarea id="ideaText">${safe(i.text)}</textarea><label>Título</label><input id="ideaTitle" value="${safe(i.title||'')}"><div class="actions"><button class="btn" onclick="updateCoreIdea('${k}','${id}')">Guardar</button><button class="btn danger" onclick="deleteCoreIdea('${k}','${id}')">Eliminar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;i.title=document.getElementById('ideaTitle').value.trim();i.text=document.getElementById('ideaText').value.trim();save();closeModal();openIdeas(k)}
function deleteCoreIdea(k,id){if(!confirm('¿Eliminar esta idea?'))return;data.ideasByCore[k]=coreIdeas(k).filter(x=>x.id!==id);save();openIdeas(k)}
function quickCapture(){
 modal(`<h2>Captura rápida</h2><p class="muted">La idea se guarda como borrador mientras escribís.</p><label>Idea o pendiente</label><textarea id="noteText" placeholder="Escribí acá..."></textarea><label>Núcleo</label><select id="noteCore"><option value="">Sin clasificar</option>${activeCores().map(c=>`<option value="${c[0]}">${safe(coreName(c[0]))}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveNote()">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields('quick-note',['noteText','noteCore']);
}
function saveNote(){const text=document.getElementById('noteText').value.trim();if(!text)return alert('Escribí una idea.');data.notes.push({id:uid(),text,core:document.getElementById('noteCore').value,at:Date.now()});if(!save())return;clearDraft('quick-note');closeModal();alert('Idea guardada.')}
// SISTEMA DE ATENCIÓN V30: agenda, pendientes olvidados y sugerencias de enfoque.
const ATTENTION_DAY=86400000;
function attentionDateLabel(iso){return calParse(iso).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'})}
function attentionCalendarItems(day){return (data.calendarItems||[]).filter(x=>x.reminder!==false&&!x.doneDates?.includes(day)&&calOccurs(x,day)).map(x=>({id:x.id,type:'calendar',title:x.kind==='mission'?(mission(x.missionId)?.name||x.title||'Misión'):x.title||'Recordatorio',core:x.core||'neutral',time:x.time||'',day,kind:x.kind,missionId:x.missionId||null})).filter(x=>x.title)}
function attentionMissionItems(){const now=Date.now(),week=7*ATTENTION_DAY,today=calISO(new Date());return data.missions.filter(m=>!m.archived&&!m.done&&!m.completedAt&&m.projectId&&project(m.projectId)&&!project(m.projectId).archived).map(m=>{const activity=m.lastActivityAt||m.created||now;return {...m,_activity:activity,_age:now-activity}}).filter(m=>m._age>=week&&!(m.attentionSnoozedUntil>now)&&!(m.attentionReviewDate&&m.attentionReviewDate>=today))}
function attentionProjectNudge(){const active=data.projects.filter(p=>!p.archived&&!p.completedAt);return active.length>7?{count:active.length}:null}
function attentionReviewItems(day){return data.missions.filter(m=>m.attentionReviewDate===day&&!m.done&&!m.completedAt).map(m=>({id:m.id,type:'mission-review',title:m.name,core:project(m.projectId)?.core||'neutral',day}))}
function attentionDayItems(day){return [...attentionCalendarItems(day),...attentionReviewItems(day)]}
function attentionUpcomingItems(){const today=calParse(calISO(new Date())),out=[];for(let i=2;i<=7;i++){const d=new Date(today);d.setDate(d.getDate()+i);const iso=calISO(d);out.push(...attentionCalendarItems(iso))}data.missions.filter(m=>m.attentionReviewDate&&!m.done&&!m.completedAt).forEach(m=>{if(m.attentionReviewDate>=calISO(new Date())&&m.attentionReviewDate<=calISO(new Date(Date.now()+7*ATTENTION_DAY)))out.push({id:m.id,type:'mission-review',title:m.name,core:project(m.projectId)?.core||'neutral',day:m.attentionReviewDate})});return out.sort((a,b)=>(a.day||'').localeCompare(b.day||''))}
function attentionCount(){const t=calISO(new Date()),tom=calISO(new Date(Date.now()+ATTENTION_DAY));return attentionDayItems(t).length+attentionDayItems(tom).length+attentionMissionItems().length}
function attentionState(){const today=attentionCalendarItems(calISO(new Date())).length,tomorrow=attentionCalendarItems(calISO(new Date(Date.now()+ATTENTION_DAY))).length,overdue=attentionMissionItems().length;let color='#8fc5d8';if(today&&tomorrow)color='#9455C8';else if(today)color='#DC4148';else if(tomorrow)color='#287FD2';else if(overdue)color='#E58A32';return {today,tomorrow,overdue,color,count:today+tomorrow+overdue}}
function refreshBrain(){const a=attentionState();const el=document.getElementById('attentionBrain');if(el){el.style.setProperty('--brain-color',a.color);const c=el.querySelector('.brain-count');if(c){c.textContent=a.count;c.hidden=!a.count}}}
function attentionOpenCalendar(id,day){const item=(data.calendarItems||[]).find(x=>x.id===id);if(!item)return;closeModal();if(!calendarIsAvailable()){alert('Calendario está desactivado en esta publicación.');return}calDate=calParse(day||item.date);calView='day';tab='calendar';render();setTimeout(()=>calItemOptions(id),80)}
function attentionOpenTarget(type,id,day){closeModal();if(type==='calendar'){attentionOpenCalendar(id,day);return}if(type==='mission-review'){const m=mission(id);if(m){delete m.attentionReviewDate;delete m.attentionSnoozedUntil;m.lastActivityAt=Date.now();save()}openMission(id);return}if(type==='mission'){openMission(id);return}if(type==='task'){const t=data.tasks.find(x=>x.id===id);if(!t)return;openMission(t.missionId);setTimeout(()=>{const el=document.getElementById('task-'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--accent)';setTimeout(()=>el.style.outline='',1800)}},120)}}
function attentionReviewMission(id){const m=mission(id);if(!m)return;const d=new Date();d.setDate(d.getDate()+7);const min=calISO(new Date());modal(`<h2>Volver a revisar</h2><p class="muted">Elegí cuándo querés que HOY vuelva a preguntarte por esta misión.</p><label>Fecha de revisión</label><input id="attentionReviewDate" type="date" min="${min}" value="${calISO(d)}"><div class="actions"><button class="btn" onclick="attentionSaveReview('${id}')">Programar revisión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function attentionSaveReview(id){const m=mission(id);const date=document.getElementById('attentionReviewDate')?.value;if(!m||!date)return alert('Elegí una fecha.');m.attentionReviewDate=date;m.attentionSnoozedUntil=calParse(date).getTime();if(!save())return;closeModal();openAttention()}
function attentionResumeMission(id){const m=mission(id);if(!m)return;m.lastActivityAt=Date.now();delete m.attentionSnoozedUntil;delete m.attentionReviewDate;save();openMission(id)}
function attentionDeleteMission(id){const m=mission(id);if(!m)return;if(!confirm(`¿Eliminar la misión «${m.name}» y sus tareas? Esta acción no se puede deshacer.`))return;data.missions=data.missions.filter(x=>x.id!==id);data.tasks=data.tasks.filter(t=>t.missionId!==id);data.missionFolders=(data.missionFolders||[]).filter(f=>f.missionId!==id);data.calendarItems=(data.calendarItems||[]).filter(x=>x.missionId!==id);if(!save())return;openAttention()}
function attentionProjectCard(){const n=attentionProjectNudge();if(!n)return '';return `<section class="attention-section attention-advice"><div class="attention-tag">Sugerencia de enfoque</div><h3>Hey, perrito 🐶</h3><p>El que mucho abarca, poco aprieta. Tenés <b>${n.count} proyectos activos</b>. Antes de sumar más, estaría bueno dedicarles tiempo a los que ya empezaste. Desarrollalos y llevalos adelante.</p><p class="small muted">Podés crear otro proyecto igualmente; HOY solo te invita a enfocarte.</p><div class="attention-actions"><button class="btn secondary" onclick="closeModal();tab='cores';render()">Ver mis proyectos</button><button class="btn ghost" onclick="closeModal();newProject()">Crear otro proyecto</button></div></section>`}
function attentionCalendarSection(title,items){const rows=items.length?items.map(x=>`<div class="attention-row" role="button" tabindex="0" onclick="attentionOpenTarget('${x.type==='mission-review'?'mission-review':'calendar'}','${x.id}','${x.day}')" onkeydown="if(event.key==='Enter'){attentionOpenTarget('${x.type==='mission-review'?'mission-review':'calendar'}','${x.id}','${x.day}')}"><span class="cal-dot ${x.core}"></span><div class="attention-row-main"><b>${calEsc(x.title)}</b><small>${x.time||'Revisión de misión'} · ${attentionDateLabel(x.day)}</small></div><span>›</span></div>`).join(''):'<div class="attention-empty">Nada pendiente.</div>';return `<section class="attention-section"><div class="row between"><h3>${title}</h3><span class="small">${items.length}</span></div>${rows}</section>`}
function attentionOverdueSection(items){const rows=items.length?items.map(m=>{const p=project(m.projectId),age=Math.floor(m._age/ATTENTION_DAY);return `<div class="attention-row"><span class="cal-dot ${p?.core||'neutral'}"></span><div class="attention-row-main"><b>${calEsc(m.name||'Misión')}</b><small>${calEsc(p?.name||'Proyecto')} · Sin movimiento hace ${age} días</small><div class="attention-actions"><button class="btn secondary" onclick="attentionResumeMission('${m.id}')">Retomar</button><button class="btn ghost" onclick="attentionReviewMission('${m.id}')">Reprogramar revisión</button><button class="btn ghost" onclick="attentionDeleteMission('${m.id}')">Eliminar</button></div></div></div>`}).join(''):'<div class="attention-empty">No hay misiones olvidadas.</div>';return `<section class="attention-section"><div class="row between"><h3>ATRASADAS / SIN MOVIMIENTO</h3><span class="small">${items.length}</span></div>${rows}</section>`}
function openAttention(){const today=calISO(new Date()),tomorrow=calISO(new Date(Date.now()+ATTENTION_DAY)),a=attentionDayItems(today),b=attentionDayItems(tomorrow),upcoming=attentionUpcomingItems(),overdue=attentionMissionItems();const future=upcoming.filter(x=>x.day!==today&&x.day!==tomorrow);const review=future.map(x=>`<div class="attention-row" role="button" tabindex="0" onclick="${x.type==='mission-review'?`attentionOpenTarget('mission-review','${x.id}')`:`attentionOpenTarget('calendar','${x.id}','${x.day}')`}"><span class="cal-dot ${x.core}"></span><div class="attention-row-main"><b>${calEsc(x.title)}</b><small>${attentionDateLabel(x.day)}</small></div><span>›</span></div>`).join('');modal(`<div class="attention-modal-head"><span class="brain-symbol">🧠</span><h2>Tu atención</h2></div><div class="attention-actions"><button class="btn" onclick="attentionNewReminder()">＋ Crear recordatorio</button></div>${attentionProjectCard()}${attentionCalendarSection('HOY · '+attentionDateLabel(today),a)}${attentionCalendarSection('MAÑANA · '+attentionDateLabel(tomorrow),b)}<section class="attention-section"><div class="row between"><h3>PRÓXIMAMENTE</h3><span class="small">${future.length}</span></div>${review||'<div class="attention-empty">No hay nada programado para los próximos 7 días.</div>'}</section>${attentionOverdueSection(overdue)}<div class="actions"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`)}
function attentionNewReminder(){if(!calendarIsAvailable())return alert('El calendario está desactivado en esta publicación.');calDate=new Date();modal(`<h2>Nuevo recordatorio</h2><label>¿Qué necesitás recordar?</label><input id="calTitle" placeholder="Escribí tu recordatorio" maxlength="100"><label>Núcleo (opcional)</label><select id="calCore"><option value="neutral">Sin núcleo</option>${activeCores().map(c=>`<option value="${c[0]}">${calEsc(coreName(c[0]))}</option>`).join('')}</select>${calBaseFields()}<div class="actions"><button class="btn" onclick="attentionSaveReminder()">Guardar recordatorio</button><button class="btn ghost" onclick="closeModal();openAttention()">Cancelar</button></div>`)}
function attentionSaveReminder(){const title=document.getElementById('calTitle').value.trim(),v=calReadSchedule();if(!title)return alert('Escribí qué necesitás recordar.');if(!v.date)return alert('Elegí una fecha.');data.calendarItems.push({id:uid(),kind:'note',title,core:document.getElementById('calCore').value||'neutral',date:v.date,time:v.time,repeat:v.repeat,interval:v.interval,until:v.until,reminder:v.reminder,doneDates:[],created:Date.now()});if(!save())return;closeModal();calDate=calParse(v.date);tab='calendar';render()}
function checkReminderAlerts(){const today=calISO(new Date()),items=attentionCalendarItems(today);if(!items.length)return;const key='hoy-reminder-alert-'+today;let shown=[];try{shown=JSON.parse(sessionStorage.getItem(key)||'[]')}catch(e){}const due=items.filter(x=>{const original=(data.calendarItems||[]).find(z=>z.id===x.id);const hour=original?.time||'09:00';return hour<=new Date().toTimeString().slice(0,5)&&!shown.includes(x.id)});if(!due.length)return;shown.push(...due.map(x=>x.id));try{sessionStorage.setItem(key,JSON.stringify(shown))}catch(e){}const banner=document.getElementById('reminderBanner');if(banner){banner.innerHTML=`<b>🧠 Tenés ${due.length} recordatorio(s)</b><button onclick="openAttention()">Ver</button><button aria-label="Cerrar" onclick="this.parentElement.hidden=true">×</button>`;banner.hidden=false}}
function checkAttentionPrompts(){const now=Date.now();if(!data.attentionMeta)data.attentionMeta={};const meta=data.attentionMeta,overdue=attentionMissionItems(),projects=attentionProjectNudge();const missionDue=overdue.length&&(!meta.lastMissionNudgeAt||now-meta.lastMissionNudgeAt>=7*ATTENTION_DAY);const projectDue=projects&&(!meta.lastProjectNudgeAt||now-meta.lastProjectNudgeAt>=7*ATTENTION_DAY);if(!missionDue&&!projectDue)return;const banner=document.getElementById('reminderBanner');if(!banner||!banner.hidden)return;const bits=[];if(missionDue){bits.push(`${overdue.length} misión(es) llevan más de una semana sin movimiento`);meta.lastMissionNudgeAt=now}if(projectDue){bits.push(`tenés ${projects.count} proyectos activos`);meta.lastProjectNudgeAt=now}if(!save())return;banner.innerHTML=`<b>🧠 Hey, perrito. ${bits.join(' y ')}.</b><button onclick="openAttention()">Revisar</button><button aria-label="Cerrar" onclick="this.parentElement.hidden=true">×</button>`;banner.hidden=false}
function initAttention(){refreshBrain();checkReminderAlerts();checkAttentionPrompts();setInterval(()=>{refreshBrain();checkReminderAlerts()},30000)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoy-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.projects)||!Array.isArray(x.tasks))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){data={...x,projects:x.projects,tasks:x.tasks,sessions:x.sessions||[],missions:x.missions||[],notes:x.notes||[],ideasByCore:x.ideasByCore||{},deletedCores:x.deletedCores||[]};save();render();alert('Copia restaurada.')}}catch{alert('El archivo no parece una copia válida de HOY.')}};r.readAsText(f)}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
loadAdviceSources().then(()=>{chooseAdviceOnLaunch();initTheme();render();initAttention();});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}});
if('serviceWorker' in navigator && location.protocol!=='file:'){
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__hoySwReloading){window.__hoySwReloading=true;location.reload();}});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
// Keep the splash as the first visible screen; reveal the app only after its fade finishes.
const hoySplash=document.getElementById('sunSplash');
if(hoySplash){
 const finishSplash=()=>document.documentElement.classList.remove('hoy-booting');
 hoySplash.addEventListener('animationend',finishSplash,{once:true});
 setTimeout(finishSplash,1100);
}else{
 document.documentElement.classList.remove('hoy-booting');
}
</script>
</body></html>
