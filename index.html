<script>
const KEY='hoy-data-v1';
const cores=[['tomas','TOMÁS','Cuerpo · Mente · Alma','tom','◉'],['asoka','ASOKA','Música · Videoclips','aso','♫'],['ruby','RUBY','Grupo · Eventos · Contenido','rub','✳'],['godd','GODD','Ropa · Merchandising','god','◇']];
let data=read(),tab='today',currentCore=null,currentProject=null,currentMission=null;
if(!Array.isArray(data.missions))data.missions=[];if(!Array.isArray(data.missionFolders))data.missionFolders=[];if(!Array.isArray(data.projectMissionFolders))data.projectMissionFolders=[];if(!Array.isArray(data.sessions))data.sessions=[];if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.projects))data.projects=[];if(!Array.isArray(data.notes))data.notes=[];if(!data.ideasByCore)data.ideasByCore={};if(!Array.isArray(data.deletedCores))data.deletedCores=[];if(!Array.isArray(data.notes))data.notes=[];if(!data.coreIcons)data.coreIcons={};if(!Array.isArray(data.customCores))data.customCores=[];if(!Array.isArray(data.completionEvents))data.completionEvents=[];data.customCores.forEach(id=>{if(!cores.some(c=>c[0]===id))cores.push([id,data.coreNames?.[id]||'NÚCLEO',data.coreDescs?.[id]||'','custom','']);});
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],tasks:[],sessions:[],notes:[]}}catch{return {projects:[],tasks:[],sessions:[],notes:[]}}}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(data));setSaveStatus('Guardado','ok');return true}
 catch(e){setSaveStatus('Error al guardar','error');return false}
}
const DRAFT_KEY='hoy-drafts-v1';
function setSaveStatus(label,state='ok'){
 const el=document.getElementById('saveStatus');
 if(el){el.textContent='● '+label;el.className='small '+(state==='error'?'save-error':state==='pending'?'save-pending':'save-ok')}
}
function readDrafts(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY))||{}}catch(e){return {}}}
function writeDraft(key,value){
 setSaveStatus('Guardando…','pending');
 try{const drafts=readDrafts();drafts[key]={value,updatedAt:Date.now()};localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));setSaveStatus('Borrador guardado','ok')}
 catch(e){setSaveStatus('Error al guardar','error')}
}
function getDraft(key){return readDrafts()[key]?.value||{}}
function clearDraft(key){const drafts=readDrafts();delete drafts[key];try{localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}catch(e){}}
function bindDraftFields(key,ids){
 const draft=getDraft(key);
 ids.forEach(id=>{
  const el=document.getElementById(id);if(!el)return;
  if(draft[id]!==undefined)el.value=draft[id];
  el.addEventListener('input',()=>{
   const value={};ids.forEach(field=>{const node=document.getElementById(field);if(node)value[field]=node.value});
   writeDraft(key,value);
  });
 });
}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coreName(k){return data.coreNames?.[k]||cores.find(c=>c[0]===k)?.[1]||k}
function coreDesc(k){return data.coreDescs?.[k]||cores.find(c=>c[0]===k)?.[2]||''}
function cname(k){return coreName(k)}
function coreIcon(k){return data.coreIcons&&Object.prototype.hasOwnProperty.call(data.coreIcons,k)?data.coreIcons[k]:(cores.find(c=>c[0]===k)?.[4]||'◇')}
function fmt(d){return new Date(d).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function project(id){return data.projects.find(p=>p.id===id)}
function mission(id){return data.missions.find(m=>m.id===id)}
function missionTasks(id){return data.tasks.filter(t=>t.missionId===id)}
function activeCores(){return cores.filter(c=>!(data.deletedCores||[]).includes(c[0]))}
function touchCore(k,projectId=null,missionId=null){data.lastMovement={core:k,projectId,missionId,at:Date.now()};save()}
function coreIdeas(k){return Array.isArray(data.ideasByCore[k])?data.ideasByCore[k]:[]}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const app=document.getElementById('app');
 if(tab==='today') app.innerHTML=today();
 if(tab==='cores') app.innerHTML=corePage();
 if(tab==='history') app.innerHTML=historyPage();
 if(tab==='ideas') app.innerHTML=ideasPage();
 if(tab==='advice') app.innerHTML=advicePage();
}

function setTheme(on){document.body.classList.toggle('dark',!!on);localStorage.setItem('hoy-theme',on?'dark':'light');const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=on?'#14212a':'#eaf4f8'}
function initTheme(){setTheme(localStorage.getItem('hoy-theme')==='dark')}
function missionCompletion(){const ms=data.missions.filter(m=>!m.archived);if(!ms.length)return 0;const completed=ms.filter(m=>{const ts=missionTasks(m.id);return ts.length>0&&ts.every(t=>t.done)}).length;return Math.round(completed/ms.length*100)}
const adviceLibrary={bible:[],martin:[],sanmartin:[
 {text:'Humanizar el carácter y hacerlo sensible aun con los insectos que nos perjudican.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla amor a la verdad y odio a la mentira.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla gran confianza y amistad, pero uniendo el respeto.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Estimular en Mercedes la caridad con los pobres.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Respeto sobre la propiedad ajena.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Acostumbrarla a guardar un secreto.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla sentimientos de indulgencia hacia todas las religiones.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Dulzura con los criados, pobres y viejos.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Que hable poco y lo preciso.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Acostumbrarla a estar formal en la mesa.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Amor al aseo y desprecio al lujo.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla amor por la Patria y por la Libertad.',ref:'Máximas de San Martín a Mercedes · 1825'}
]};
async function loadAdviceSources(){
 try{const [b,m]=await Promise.all([fetch('bible-rv1909.json').then(r=>r.json()),fetch('martin-fierro.json').then(r=>r.json())]);
 adviceLibrary.bible=b.items.map(v=>({text:v.text,ref:v.ref}));
 adviceLibrary.martin=m.items.map(v=>({text:v.text,ref:v.reference}));
 }catch(e){console.error('No se pudieron cargar las fuentes de Consejos',e)}
}
function chooseAdviceOnLaunch(){const seen=data.adviceSeen||{};data.adviceCurrent={};Object.keys(adviceLibrary).forEach(k=>{if(!adviceLibrary[k].length)return;let ids=seen[k]||[];if(ids.length>=adviceLibrary[k].length)ids=[];const pool=adviceLibrary[k].map((_,i)=>i).filter(i=>!ids.includes(i));const pick=pool[Math.floor(Math.random()*pool.length)];data.adviceCurrent[k]=pick;ids.push(pick);seen[k]=ids;});data.adviceSeen=seen;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function advicePage(){const order=['bible','martin','sanmartin'];return `<p class="eyebrow">CONSEJOS</p><h1>Consejos</h1><div class="advice-stack">${order.map(k=>{const v=adviceLibrary[k][data.adviceCurrent?.[k]??0];return `<article class="advice-panel panel"><blockquote>“${safe(v.text)}”</blockquote><div class="small">${safe(v.ref)}</div></article>`}).join('')}</div>`}

function showAllPriorities(){const list=[...data.tasks.filter(t=>!t.done&&t.priority==='Alta').map(t=>({kind:'task',item:t})),...data.missions.filter(m=>!(m.completedAt||m.done)&&m.priority==='Alta').map(m=>({kind:'mission',item:m}))].sort((a,b)=>(a.item.created||0)-(b.item.created||0));modal(`<h2>Todas las urgencias</h2>${list.map(({kind,item})=>{const p=project(item.projectId),m=kind==='mission'?item:(item.missionId?mission(item.missionId):null);return `<div class="item"><button class="text-button" onclick="closeModal();${m?`openMission('${m.id}')`:`openProject('${item.projectId}')`}">${safe(kind==='mission'?item.name:item.title)}</button><div class="small">${p?cname(p.core)+' · '+safe(p.name):'Proyecto'}${m&&kind==='task'?' · '+safe(m.name):''} · ${kind==='mission'?'Misión':'Tarea de la misión'}</div></div>`}).join('')||'<p class="muted">No hay urgencias pendientes.</p>'}<div class="actions"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`) }
function today(){
 const active=data.projects.filter(p=>!p.archived);
 const priorities=[...data.tasks.filter(t=>!t.done&&t.priority==='Alta').map(t=>({kind:'task',item:t})),...data.missions.filter(m=>!(m.completedAt||m.done)&&m.priority==='Alta').map(m=>({kind:'mission',item:m}))].sort((a,b)=>(a.item.created||0)-(b.item.created||0));
 const visiblePriorities=priorities.slice(0,3);
 const lm=data.lastMovement;
 const recentCore=lm&&activeCores().some(c=>c[0]===lm.core)?lm.core:null;
 const recentTasks=visiblePriorities.map(({kind,item})=>{const p=project(item.projectId),m=kind==='mission'?item:(item.missionId?mission(item.missionId):null),title=kind==='mission'?item.name:item.title;return `<div class="item"><button class="text-button" onclick="${m?`openMission('${m.id}')`:`openProject('${item.projectId}')`}">${safe(title)}</button><div class="small">${p?cname(p.core)+' · '+safe(p.name):'Proyecto'}${m&&kind==='task'?' · '+safe(m.name):''} · ${kind==='mission'?'Misión':'Tarea de la misión'}</div></div>`}).join('');
 const pendingTasks=data.tasks.filter(t=>!t.done).length;
 const pendingMissions=data.missions.filter(m=>!m.completedAt&&!m.done).length;
 return `<p class="small">CENTRO DE CONTROL</p><h1 class="dashboard-title">El mundo es de quien lo hace suyo</h1>
 <div class="recent-compact"><div class="headline"><h2>Últimos movimientos</h2><span class="small">Último núcleo</span></div>${recentCore?`<div class="recent-entry"><div><b>${safe(coreName(recentCore))}</b><div class="small">${lm.projectId&&project(lm.projectId)&&!project(lm.projectId).archived?safe(project(lm.projectId).name):'Último espacio de trabajo'}<br>${lm.at?fmt(lm.at):''}</div></div><button class="btn secondary" onclick="showCore('${recentCore}')">Abrir</button></div>`:'<div class="recent-entry"><span class="small">Todavía no hay actividad registrada.</span></div>'}</div>
 <div class="panel" id="priorityPanel"><div class="row between"><h2>Prioridades</h2><span class="small">${visiblePriorities.length}/3</span></div>${priorities.length?recentTasks:'<p class="muted">No hay prioridades altas pendientes.</p>'}${priorities.length>3?`<button class="priority-more" onclick="showAllPriorities()">•••</button>`:''}</div>
 <div class="row between"><h2>Tus núcleos</h2><button class="btn ghost" onclick="tab='cores';render()">Ver todos</button></div><div class="grid">${activeCores().map(c=>coreTile(c)).join('')}</div>
 <div class="activity-inline"><span><b>${active.length}</b> proyectos</span><span><b>${pendingTasks}</b> tareas de la misión pendientes</span><span><b>${pendingMissions}</b> misiones pendientes</span></div><div class="theme-control"><span>Modo oscuro</span><label class="switch"><input type="checkbox" id="themeSwitch" ${localStorage.getItem('hoy-theme')==='dark'?'checked':''} onchange="setTheme(this.checked)"><span></span></label></div>`;
}
function coreTile(c){const icon=coreIcon(c[0]);const color=data.coreColors?.[c[0]]||defaultCoreColor(c[0]);return `<button class="core ${icon?'':'no-symbol'}" style="border-top:3px solid ${color};background:linear-gradient(145deg,${hexWithAlpha(color,'20')},#fffdf5e8)" onclick="showCore('${c[0]}')"><div class="core-symbol">${safe(icon)}</div><strong>${safe(coreName(c[0]))}</strong><span class="core-description">${safe(coreDesc(c[0]))}</span><span class="edit-icon" onclick="event.stopPropagation();editCore('${c[0]}')">✎</span></button>`}
function defaultCoreColor(k){return ({tomas:'#91b9c7',asoka:'#86a9c7',ruby:'#c89ca7',godd:'#c9a66d'})[k]||'#c99b4b'}
function hexWithAlpha(hex,alpha){const h=String(hex||'#c99b4b').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return '#c99b4b20';return `#${h}${alpha}`}

function corePage(){return `<div class="row between"><div><p class="small">ESPACIOS DE TRABAJO</p><h1>Núcleos</h1></div><button class="btn" onclick="newCore()">＋ Núcleo</button></div><p class="muted">Cada núcleo mantiene sus proyectos e historial.</p><div class="grid">${activeCores().map(c=>coreTile(c)).join('')}</div>`}
function newCore(){modal(`<h2>Nuevo núcleo</h2><label>Nombre</label><input id="newCoreName" placeholder="Nombre del núcleo"><label>Descripción</label><input id="newCoreDesc" placeholder="Área de trabajo"><label>Símbolo o emoji (opcional)</label><input id="newCoreIcon" maxlength="8" placeholder="Dejalo vacío si no querés símbolo"><label>Color del bloque</label><input id="newCoreColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveNewCore()">Crear núcleo</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveNewCore(){const name=document.getElementById('newCoreName').value.trim();if(!name)return alert('Escribí un nombre.');const id='custom-'+uid();cores.push([id,name,document.getElementById('newCoreDesc').value.trim(),'custom','◇']);if(!data.customCores)data.customCores=[];data.customCores.push(id);if(!data.coreNames)data.coreNames={};if(!data.coreDescs)data.coreDescs={};if(!data.coreIcons)data.coreIcons={};if(!data.coreColors)data.coreColors={};data.coreNames[id]=name;data.coreDescs[id]=document.getElementById('newCoreDesc').value.trim();data.coreIcons[id]=document.getElementById('newCoreIcon').value.trim();data.coreColors[id]=document.getElementById('newCoreColor').value;save();closeModal();tab='cores';render()}

function showCore(k){currentCore=k;tab='core';touchCore(k);renderCore()}
function renderCore(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',false));document.getElementById('app').innerHTML=coreDetail(currentCore)}
function coreDetail(k){const c=cores.find(x=>x[0]===k);const ps=data.projects.filter(p=>p.core===k&&!p.archived);return `<button class="btn ghost" onclick="tab='cores';render()">← Núcleos</button><div class="headline"><div><p class="small">${safe(coreName(c[0]))}</p><h1>${safe(coreDesc(c[0]))}</h1></div><button class="edit-icon" onclick="editCore('${k}')" aria-label="Editar núcleo">✎</button></div><div class="row between"><h2>Proyectos</h2><button class="btn" onclick="newProject('${k}')">+ Proyecto</button></div>${ps.length?ps.map(p=>projectCard(p)).join(''):'<div class="empty">Todavía no hay proyectos en este núcleo.</div>'}<div class="actions"><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`}
function projectCard(p){
 const ms=data.missions.filter(m=>m.projectId===p.id), oldTasks=data.tasks.filter(t=>t.projectId===p.id&&!t.missionId);
 const total=data.tasks.filter(t=>t.projectId===p.id).length,done=data.tasks.filter(t=>t.projectId===p.id&&t.done).length;
 return `<div class="project-card" onclick="openProject('${p.id}')"><div class="headline"><span class="eyebrow">${cname(p.core)} / PROYECTO</span><button class="edit-icon" onclick="event.stopPropagation();editProject('${p.id}')" aria-label="Editar proyecto">✎</button></div><div class="row between"><h3>${safe(p.name)}</h3><span class="tag">${p.completedAt?'TERMINADO':`${done}/${total}`}</span></div><p class="small">${safe(p.description||'Espacio de trabajo')}</p><div class="row between small"><span>${ms.length} misiones</span><span>${p.lastAt?'Actividad '+fmt(p.lastAt):'Sin actividad'}</span></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div></div>`;
}

function projectMissionFolders(pid){return (data.projectMissionFolders||[]).filter(f=>f.projectId===pid)}
function newProjectMissionFolder(pid){modal(`<h2>Nueva carpeta de misiones</h2><label>Nombre</label><input id="pmfName" placeholder="Ej. Producción, Pendientes"><label>Color</label><input id="pmfColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveProjectMissionFolder('${pid}')">Crear carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProjectMissionFolder(pid){const name=document.getElementById('pmfName').value.trim();if(!name)return alert('Escribí un nombre.');if(!Array.isArray(data.projectMissionFolders))data.projectMissionFolders=[];data.projectMissionFolders.push({id:uid(),projectId:pid,name,color:document.getElementById('pmfColor').value||'#c99b4b'});save();closeModal();openProject(pid)}
function editProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;modal(`<h2>Editar carpeta</h2><label>Nombre</label><input id="epmfName" value="${safe(f.name)}"><label>Color</label><input id="epmfColor" type="color" value="${safe(f.color||'#c99b4b')}"><div class="actions"><button class="btn" onclick="updateProjectMissionFolder('${fid}')">Guardar</button><button class="btn danger" onclick="deleteProjectMissionFolder('${fid}')">Eliminar carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;f.name=document.getElementById('epmfName').value.trim()||f.name;f.color=document.getElementById('epmfColor').value||f.color;save();closeModal();openProject(f.projectId)}
function deleteProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;if(!confirm('¿Eliminar carpeta? Las misiones se conservarán sin carpeta.'))return;data.missions.forEach(m=>{if(m.folderId===fid)delete m.folderId});data.projectMissionFolders=data.projectMissionFolders.filter(x=>x.id!==fid);save();closeModal();openProject(f.projectId)}
function missionPriorityBadge(m){return `<span class="priority-badge priority-${String(m.priority||'Media').toLowerCase()}">${safe(m.priority||'Media')}</span>`}

let projectFolderFilter = {};
function setProjectFolderFilter(pid,folderId){projectFolderFilter[pid]=folderId;openProject(pid)}
function openProject(pid){
 currentProject=pid;const p=project(pid);if(!p)return;tab='project';touchCore(p.core,pid);
 const allMs=data.missions.filter(m=>m.projectId===pid).slice().sort((a,b)=>(a.order??0)-(b.order??0));const ms=allMs.filter(m=>!(m.completedAt||m.done));const doneMs=allMs.filter(m=>!!(m.completedAt||m.done));
 const oldTasks=data.tasks.filter(t=>t.projectId===pid&&!t.missionId),folders=projectMissionFolders(pid);
 const activeFolder=projectFolderFilter[pid]||'';
 const visibleMs=activeFolder?ms.filter(m=>m.folderId===activeFolder):ms;
 const folderShortcuts=`<div class="folder-shortcuts"><button class="folder-shortcut folder-general ${!activeFolder?'selected':''}" onclick="setProjectFolderFilter('${pid}','')"><span class="folder-symbol">📂</span><strong>General</strong><span class="folder-count">${ms.length}</span></button>${folders.map(f=>{const count=ms.filter(m=>m.folderId===f.id).length;return `<div class="folder-shortcut-wrap"><button class="folder-shortcut ${activeFolder===f.id?'selected':''}" style="--folder-color:${safe(f.color||'#c99b4b')}" onclick="setProjectFolderFilter('${pid}','${f.id}')"><span class="folder-symbol">📁</span><strong>${safe(f.name)}</strong><span class="folder-count">${count}</span></button><button class="folder-shortcut-edit" onclick="editProjectMissionFolder('${f.id}')" aria-label="Editar carpeta">✎</button></div>`}).join('')}</div>`;
 const loose=visibleMs;
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${p.core}')">← ${cname(p.core)}</button><p class="eyebrow">${cname(p.core)} / PROYECTO</p><div class="headline"><h1>${safe(p.name)}</h1><button class="edit-icon" onclick="editProject('${p.id}')">✎</button></div><p class="muted">${safe(p.description||'')}</p>${p.completedAt?`<span class="tag">PROYECTO TERMINADO · ${fmt(p.completedAt)}</span>`:''}
 <div class="row between section-head"><div><h2>Misiones</h2><p class="small">Dividí el proyecto en partes de trabajo.</p></div><button class="btn" onclick="newMission('${p.id}')">＋ Misión</button></div>
 <div class="project-folder-create"><button class="btn secondary" onclick="newProjectMissionFolder('${p.id}')">📁 Crear carpeta</button></div>
 ${folders.length?folderShortcuts:''}
 <div class="mission-grid">${loose.map(m=>missionCard(m)).join('')||'<div class="empty">'+(activeFolder?'Esta carpeta no tiene misiones.':'No hay misiones pendientes.')+'</div>'}</div>${doneMs.length?`<details class="mission-completed-list"><summary><span>Misiones completadas</span><span class="completed-count">${doneMs.length}</span><span class="completed-more">⋯</span></summary><div class="completed-missions">${doneMs.map(m=>`<div class="item row between"><div><b>${safe(m.name)}</b><div class="small">Completada · ${fmt(m.completedAt||m.doneAt||Date.now())}</div></div><button class="btn secondary" onclick="openMission('${m.id}')">Ver</button></div>`).join('')}</div></details>`:''}
 ${oldTasks.length?`<div class="panel"><h3>Tareas de la misión sin asignar</h3><p class="small">Estas tareas ya existían en el proyecto. Podés mantenerlas acá o asignarlas a una misión más adelante.</p>${oldTasks.map(t=>taskRow(t)).join('')}</div>`:''}
 <div class="completion-actions">${p.completedAt?`<span class="tag">TERMINADO · ${fmt(p.completedAt)}</span>`:''}<button class="btn ${p.completedAt?'secondary':''}" onclick="toggleProjectComplete('${p.id}')">${p.completedAt?'↶ Reabrir proyecto':'✓ Finalizar proyecto'}</button></div><div class="actions"><button class="btn ghost" onclick="editProject('${p.id}')">Editar proyecto</button><button class="btn ghost" onclick="archiveProject('${p.id}')">Archivar</button><button class="btn danger" onclick="deleteProject('${p.id}')">Eliminar</button></div>`;
}
function missionCard(m){
 const ts=missionTasks(m.id),done=ts.filter(t=>t.done).length;
 const siblings=data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0));const idx=siblings.findIndex(x=>x.id===m.id),number=idx+1;
 return `<div class="mission-card" onclick="openMission('${m.id}')"><div class="mission-line"><div class="mission-index"><div class="mission-number-tile"><span class="number">${number}</span></div>${missionPriorityBadge(m)}</div><div class="mission-main"><h3>${safe(m.name)} ${m.completedAt?'✓':''}</h3>${m.description?`<p class="small">${safe(m.description)}</p>`:''}<div class="small">${done}/${ts.length} tareas completadas</div></div><div class="mission-tools"><button class="mission-select mission-folder-action" type="button" aria-label="Meter en carpeta" title="Meter en carpeta" onclick="event.stopPropagation();moveMissionToFolder('${m.id}')">✓</button><button onclick="event.stopPropagation();moveMission('${m.id}',-1)" ${idx===0?'disabled':''} aria-label="Subir misión">↑</button><button onclick="event.stopPropagation();moveMission('${m.id}',1)" ${idx===siblings.length-1?'disabled':''} aria-label="Bajar misión">↓</button><button onclick="event.stopPropagation();editMission('${m.id}')" aria-label="Editar misión">✎</button></div></div><div class="progress"><i style="width:${ts.length?done/ts.length*100:0}%"></i></div><div class="small">Abrir misión →</div></div>`;
}

function moveMission(mid,delta){const m=mission(mid);if(!m)return;const list=data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0));const i=list.findIndex(x=>x.id===mid),j=i+delta;if(j<0||j>=list.length)return;const [moved]=list.splice(i,1);list.splice(j,0,moved);list.forEach((x,n)=>x.order=n);save();openProject(m.projectId)}
function openMission(mid){
 const m=mission(mid);if(!m)return;currentMission=mid;const p=project(m.projectId);if(!p)return;tab='mission';touchCore(p.core,p.id,mid);
 const ts=missionTasks(mid),isDone=!!(m.completedAt||m.done),folders=(data.missionFolders||[]).filter(f=>f.missionId===mid);
 const folderTasks=folders.map(f=>{const list=ts.filter(t=>t.folderId===f.id);return `<section class="mission-folder" style="--folder-color:${safe(f.color||'#c99b4b')}"><div class="folder-heading"><span class="folder-symbol">📁</span><strong>${safe(f.name)}</strong><span class="small">${list.filter(t=>t.done).length}/${list.length}</span><div class="folder-tools"><button onclick="editMissionFolder('${f.id}')" aria-label="Editar carpeta">✎</button><button onclick="deleteMissionFolder('${f.id}')" aria-label="Eliminar carpeta">×</button></div></div>${list.map(t=>taskRow(t)).join('')||'<div class="folder-empty">Carpeta vacía. Agregá una tarea y elegí esta carpeta.</div>'}</section>`}).join('');
 const loose=ts.filter(t=>!t.folderId||!folders.some(f=>f.id===t.folderId));
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="openProject('${p.id}')">← ${safe(p.name)}</button><p class="eyebrow">${cname(p.core)} / ${safe(p.name)}</p><div class="mission-hero ${isDone?'status-done':''}"><div class="mission-number-tile"><span class="number">${data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0)).findIndex(x=>x.id===m.id)+1}</span><span class="word">MISIÓN</span>${missionPriorityBadge(m)}</div><div class="headline"><h1>${safe(m.name)}</h1><button class="edit-icon" onclick="editMission('${m.id}')">✎</button></div>${m.description?`<p class="muted">${safe(m.description)}</p>`:''}${isDone?`<span class="tag">COMPLETADA · ${fmt(m.completedAt)}</span>`:''}</div>
 <div class="row between section-head"><div><h2>Tareas de la misión</h2><p class="small">${ts.filter(t=>!t.done).length} pendientes · ${ts.filter(t=>t.done).length} completadas</p></div><button class="btn" onclick="newTask('${p.id}','${m.id}')">＋ Tarea de la misión</button></div>

 <div class="task-list">${ts.map(t=>taskRow(t)).join('')||'<div class="empty">Todavía no hay tareas de la misión.</div>'}</div>
 <div class="completion-actions"><button class="btn ${isDone?'secondary':''}" onclick="toggleMissionComplete('${m.id}')">${isDone?'↶ Reabrir misión':'✓ Marcar misión completada'}</button><button class="btn ghost" onclick="moveMissionToFolder('${m.id}')">Mover a carpeta</button><button class="btn ghost" onclick="editMission('${m.id}')">Editar misión</button><button class="btn danger" onclick="deleteMission('${m.id}')">Eliminar misión</button></div>`;
}
function newMissionFolder(mid){modal(`<h2>Nueva carpeta</h2><label>Nombre de la carpeta</label><input id="mfName" placeholder="Ej. Investigación, Producción, Pendientes"><label>Color de la carpeta</label><input id="mfColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveMissionFolder('${mid}')">Crear carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveMissionFolder(mid){const name=document.getElementById('mfName').value.trim();if(!name)return alert('Escribí un nombre para la carpeta.');if(!Array.isArray(data.missionFolders))data.missionFolders=[];data.missionFolders.push({id:uid(),missionId:mid,name,color:document.getElementById('mfColor').value||'#c99b4b',created:Date.now()});if(!save())return;closeModal();openMission(mid)}
function editMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;modal(`<h2>Editar carpeta</h2><label>Nombre</label><input id="emfName" value="${safe(f.name)}"><label>Color</label><input id="emfColor" type="color" value="${safe(f.color||'#c99b4b')}"><div class="actions"><button class="btn" onclick="updateMissionFolder('${fid}')">Guardar cambios</button><button class="btn danger" onclick="deleteMissionFolder('${fid}')">Eliminar carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;f.name=document.getElementById('emfName').value.trim()||f.name;f.color=document.getElementById('emfColor').value||f.color;if(!save())return;closeModal();openMission(f.missionId)}
function deleteMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;if(!confirm('¿Eliminar esta carpeta? Las tareas se conservarán y quedarán sin carpeta.'))return;data.tasks.forEach(t=>{if(t.folderId===fid)delete t.folderId});data.missionFolders=data.missionFolders.filter(x=>x.id!==fid);if(!save())return;closeModal();openMission(f.missionId)}

function taskRow(t){const subs=Array.isArray(t.subtasks)?t.subtasks:[];return `<div class="task-row"><div class="task-main"><label><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="${t.done?'completed':''}">${safe(t.title)}</span></label>${subs.length?`<div class="subtask-list">${subs.map((s,i)=>`<div class="subtask"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${t.id}',${i})"><span class="${s.done?'completed':''}">${safe(s.title)}</span></div>`).join('')}</div>`:''}<div class="small">${t.priority||'Media'}</div></div><div class="task-actions"><button class="edit-icon" onclick="editTask('${t.id}')" aria-label="Editar tarea">✎</button></div></div>`}
function historyPage(){
 const completedTasks=data.tasks.filter(t=>t.done),completedMissions=data.missions.filter(m=>!!(m.completedAt||m.done)),completedProjects=data.projects.filter(p=>!!p.completedAt);
 const events=(data.completionEvents||[]).slice().reverse();
 return `<p class="small">MEMORIA DE TRABAJO</p><h1>Historial</h1><div class="panel"><h2>Tu progreso</h2><div class="completion-stats"><div class="completion-stat"><strong>${completedMissions.length}</strong><span>Misiones cumplidas</span></div><div class="completion-stat"><strong>${completedTasks.length}</strong><span>Tareas cumplidas</span></div><div class="completion-stat"><strong>${completedProjects.length}</strong><span>Proyectos terminados</span></div></div></div>
 <div class="panel"><h2>Proyectos terminados</h2>${completedProjects.length?completedProjects.slice().sort((a,b)=>b.completedAt-a.completedAt).map(p=>`<div class="item row between"><div><b>${safe(p.name)}</b><div class="small">${safe(coreName(p.core))} · ${fmt(p.completedAt)}</div></div><button class="btn secondary" onclick="openArchivedProject('${p.id}')">Ver</button></div>`).join(''):'<p class="muted">Todavía no terminaste proyectos.</p>'}</div>
 <div class="panel"><h2>Registro de finalizaciones</h2>${events.length?events.map(e=>`<div class="event-row"><b>${e.action==='reopened'?'Reabierto':'Completado'}: ${safe(e.label)}</b><div class="small">${e.kind==='task'?'Tarea de la misión':e.kind==='mission'?'Misión':'Proyecto'} · ${fmt(e.at)}</div></div>`).join(''):'<p class="muted">Cuando completes tareas, misiones o proyectos, aparecerán acá.</p>'}</div>
 <div class="panel"><h2>Cómo funciona HOY</h2><p class="small">Una guía rápida para organizarte.</p><button class="btn secondary" onclick="showTutorial()">Ver tutorial</button></div><div class="panel"><h2>Copias de seguridad</h2><p class="small">Tus datos se guardan en este navegador. Exportá una copia periódicamente.</p><button class="btn secondary" onclick="exportData()">Descargar copia JSON</button><label>Restaurar copia</label><input type="file" accept="application/json" onchange="importData(event)"></div>`;
}

function showTutorial(){modal(`<h2>Cómo funciona HOY</h2><p><b>Núcleos:</b> organizá las áreas de tu vida.</p><p><b>Proyectos:</b> agrupá objetivos relacionados con un núcleo.</p><p><b>Misiones:</b> dividí cada proyecto en etapas.</p><p><b>Tareas de la misión:</b> convertí cada misión en acciones concretas.</p><p><b>Ideas:</b> capturá pensamientos y convertí los que quieras desarrollar en misiones.</p><p><b>Historial:</b> consultá lo que terminaste y tu progreso.</p><hr><p><b>Por ejemplo, tenés un proyecto de una panadería.</b></p><div class="tutorial-example"><div class="tutorial-core"><div class="tutorial-task-label">Núcleo</div><h3>🏪 Panadería</h3><div class="tutorial-project"><div class="tutorial-task-label">Proyecto</div><b>Restauración de la panadería</b><div class="tutorial-mission"><div class="tutorial-task-label">Misión</div><b>Pintar paredes</b><div class="tutorial-task-label">Tareas de la misión</div><div class="tutorial-task">Contratar pintor</div><div class="tutorial-task">Comprar pintura</div></div><div class="tutorial-mission"><div class="tutorial-task-label">Misión</div><b>Cambiar piso</b><div class="tutorial-task-label">Tareas de la misión</div><div class="tutorial-task">Contratar quién lo coloca</div><div class="tutorial-task">Tomar medidas</div><div class="tutorial-task">Ir a comprar los materiales</div></div></div></div></div><div class="actions"><button class="btn" onclick="closeModal()">Entendido</button></div>`)}
function openArchivedProject(pid){const p=project(pid);if(!p)return;const was=p.archived;p.archived=false;openProject(pid);p.archived=was;}

function modal(content){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newProject(core=currentCore||'tomas'){modal(`<h2>Nuevo proyecto</h2><label>Núcleo</label><select id="pCore">${activeCores().map(c=>`<option value="${c[0]}" ${c[0]===core?'selected':''}>${safe(coreName(c[0]))}</option>`).join('')}</select><label>Nombre</label><input id="pName" placeholder="Ej. Videoclip nuevo"><label>Descripción</label><textarea id="pDesc" placeholder="¿De qué se trata?"></textarea><div class="actions"><button class="btn" onclick="saveProject()">Crear proyecto</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProject(){const name=document.getElementById('pName').value.trim();if(!name)return alert('Escribí un nombre.');const p={id:uid(),core:document.getElementById('pCore').value,name,description:document.getElementById('pDesc').value.trim(),created:Date.now(),archived:false,last:'',next:'',lastAt:null};data.projects.push(p);save();closeModal();currentCore=p.core;renderCore()}
function editProject(pid){const p=project(pid);modal(`<h2>Editar proyecto</h2><label>Nombre</label><input id="eName" value="${safe(p.name)}"><label>Descripción</label><textarea id="eDesc">${safe(p.description)}</textarea><div class="actions"><button class="btn" onclick="updateProject('${pid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProject(pid){const p=project(pid);p.name=document.getElementById('eName').value.trim()||p.name;p.description=document.getElementById('eDesc').value;save();closeModal();openProject(pid)}
let selectedMissionIds=new Set();
function toggleMissionSelection(mid,checked){if(checked)selectedMissionIds.add(mid);else selectedMissionIds.delete(mid)}
function moveMissionToFolder(mid){const m=mission(mid);if(!m)return;modal(`<h2>Meter en carpeta</h2><p class="small">Elegí dónde querés guardar esta misión.</p><label>Carpeta</label><select id="moveMissionFolder">${missionFolderOptions(m.projectId,m.folderId||'')}</select><div class="actions"><button class="btn" onclick="applyMoveMissionToFolder('${mid}')">Confirmar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function applyMoveMissionToFolder(mid){const m=mission(mid);if(!m)return;const folderId=document.getElementById('moveMissionFolder').value;if(folderId)m.folderId=folderId;else delete m.folderId;if(!save())return;closeModal();openProject(m.projectId)}
function moveSelectedMissions(pid){const ids=[...selectedMissionIds].filter(id=>{const m=mission(id);return m&&m.projectId===pid});if(!ids.length)return alert('Primero seleccioná una o más misiones.');modal(`<h2>Mover ${ids.length} misión(es)</h2><label>Carpeta de destino</label><select id="bulkMissionFolder">${missionFolderOptions(pid)}</select><div class="actions"><button class="btn" onclick="applyBulkMoveMissions('${pid}')">Mover seleccionadas</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function applyBulkMoveMissions(pid){const folderId=document.getElementById('bulkMissionFolder').value||null;selectedMissionIds.forEach(id=>{const m=mission(id);if(m&&m.projectId===pid)m.folderId=folderId});selectedMissionIds.clear();if(!save())return;closeModal();openProject(pid)}
function missionFolderOptions(pid,selected=''){return `<option value="" ${!selected?'selected':''}>📂 General (sin carpeta)</option>${projectMissionFolders(pid).map(f=>`<option value="${f.id}" ${selected===f.id?'selected':''}>📁 ${safe(f.name)}</option>`).join('')}`}
function newMission(pid){modal(`<h2>Nueva misión</h2><label>Nombre</label><input id="mName" placeholder="Ej. Canción, Video, Lanzamiento"><label>Descripción</label><textarea id="mDesc" placeholder="¿Qué abarca esta misión?"></textarea><label>Carpeta</label><select id="mFolder">${missionFolderOptions(pid)}</select><label>Prioridad</label><select id="mPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><div class="actions"><button class="btn" onclick="saveMission('${pid}')">Crear misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveMission(pid){const name=document.getElementById('mName').value.trim();if(!name)return alert('Escribí un nombre.');const m={id:uid(),projectId:pid,name,description:document.getElementById('mDesc').value.trim(),folderId:document.getElementById('mFolder').value||null,priority:document.getElementById('mPriority').value,order:data.missions.filter(x=>x.projectId===pid&&!(x.completedAt||x.done)).length,created:Date.now()};data.missions.push(m);save();closeModal();openProject(pid)}
function editMission(mid){const m=mission(mid);modal(`<h2>Editar misión</h2><label>Nombre</label><input id="emName" value="${safe(m.name)}"><label>Descripción</label><textarea id="emDesc">${safe(m.description||'')}</textarea><label>Carpeta</label><select id="emFolder">${missionFolderOptions(m.projectId,m.folderId||'')}</select><label>Prioridad</label><select id="emPriority"><option ${m.priority==='Alta'?'selected':''}>Alta</option><option ${(!m.priority||m.priority==='Media')?'selected':''}>Media</option><option ${m.priority==='Baja'?'selected':''}>Baja</option></select><div class="actions"><button class="btn" onclick="updateMission('${mid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateMission(mid){const m=mission(mid);m.name=document.getElementById('emName').value.trim()||m.name;m.description=document.getElementById('emDesc').value;m.folderId=document.getElementById('emFolder').value||null;m.priority=document.getElementById('emPriority').value;save();closeModal();openProject(m.projectId)}
function newTask(pid,mid=''){const folders=(data.missionFolders||[]).filter(f=>f.missionId===mid);modal(`<h2>Nueva tarea de la misión</h2><label>Tarea de la misión</label><input id="tTitle" placeholder="¿Qué hay que hacer?"><label>Prioridad</label><select id="tPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><label>Subtareas (una por línea, opcional)</label><textarea id="tSubs" placeholder="Primer paso&#10;Segundo paso&#10;Tercer paso"></textarea><div class="actions"><button class="btn" onclick="saveTask('${pid}','${mid}')">Guardar tarea de la misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTask(pid,mid=''){const title=document.getElementById('tTitle').value.trim();if(!title)return alert('Escribí una tarea.');const subtasks=document.getElementById('tSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:false}));data.tasks.push({id:uid(),projectId:pid,missionId:mid||null,folderId:document.getElementById('tFolder')?.value||null,title,priority:document.getElementById('tPriority').value,subtasks,done:false,created:Date.now()});save();closeModal();mid?openMission(mid):openProject(pid)}

function editCore(k){const color=data.coreColors?.[k]||defaultCoreColor(k);modal(`<h2>Editar núcleo</h2><label>Nombre</label><input id="cName" value="${safe(coreName(k))}"><label>Descripción</label><input id="cDesc" value="${safe(coreDesc(k))}"><label>Símbolo o emoji (opcional)</label><input id="cIcon" maxlength="8" value="${safe(coreIcon(k))}" placeholder="Dejalo vacío para no mostrar símbolo"><label>Color del bloque</label><input id="cColor" type="color" value="${color}"><div class="actions"><button class="btn" onclick="saveCore('${k}')">Guardar cambios</button><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`)}
function saveCore(k){if(!data.coreNames)data.coreNames={};if(!data.coreDescs)data.coreDescs={};if(!data.coreIcons)data.coreIcons={};if(!data.coreColors)data.coreColors={};data.coreNames[k]=document.getElementById('cName').value.trim()||coreName(k);data.coreDescs[k]=document.getElementById('cDesc').value.trim();data.coreIcons[k]=document.getElementById('cIcon').value.trim();data.coreColors[k]=document.getElementById('cColor').value||defaultCoreColor(k);save();closeModal();if(tab==='core')renderCore();else render()}

function editTask(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;modal(`<h2>Editar tarea de la misión</h2><label>Nombre</label><input id="etTitle" value="${safe(t.title)}"><label>Carpeta</label><select id="etFolder"><option value="">Sin carpeta</option>${(data.missionFolders||[]).filter(f=>f.missionId===t.missionId).map(f=>`<option value="${f.id}" ${t.folderId===f.id?'selected':''}>📁 ${safe(f.name)}</option>`).join('')}</select><label>Prioridad</label><select id="etPriority"><option ${t.priority==='Baja'?'selected':''}>Baja</option><option ${t.priority==='Media'?'selected':''}>Media</option><option ${t.priority==='Alta'?'selected':''}>Alta</option></select><label>Subtareas (una por línea)</label><textarea id="etSubs">${(t.subtasks||[]).map(s=>safe(s.title)).join('\n')}</textarea><div class="actions"><button class="btn" onclick="saveTaskEdit('${tid}')">Guardar cambios</button><button class="btn danger" onclick="deleteTask('${tid}')">Eliminar tarea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTaskEdit(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;t.title=document.getElementById('etTitle').value.trim()||t.title;t.priority=document.getElementById('etPriority').value;t.folderId=document.getElementById('etFolder')?.value||null;const previous=t.subtasks||[];t.subtasks=document.getElementById('etSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:previous.find(s=>s.title===title)?.done||false}));if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function deleteTask(tid){if(!confirm('¿Eliminar esta tarea y sus subtareas?'))return;const t=data.tasks.find(x=>x.id===tid);data.tasks=data.tasks.filter(x=>x.id!==tid);if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function toggleSubtask(tid,index){const t=data.tasks.find(x=>x.id===tid);if(!t||!t.subtasks||!t.subtasks[index])return;t.subtasks[index].done=!t.subtasks[index].done;if(!save())return;if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}

function addCompletionEvent(kind,action,label){if(!Array.isArray(data.completionEvents))data.completionEvents=[];data.completionEvents.push({id:uid(),kind,action,label,at:Date.now()});}
function toggleMissionComplete(mid){const m=mission(mid);if(!m)return;const reopening=!!(m.completedAt||m.done);if(reopening){m.completedAt=null;m.done=false;addCompletionEvent('mission','reopened',m.name)}else{m.completedAt=Date.now();m.done=true;m.doneAt=Date.now();addCompletionEvent('mission','completed',m.name)}if(!save())return;if(!reopening)celebrate('mission');openMission(mid)}
function toggleProjectComplete(pid){const p=project(pid);if(!p)return;const reopening=!!p.completedAt;if(reopening){p.completedAt=null;p.archived=false;addCompletionEvent('project','reopened',p.name);if(!save())return;openProject(pid)}else{if(!confirm('¿Finalizar y archivar este proyecto? Lo vas a encontrar en Historial → Proyectos terminados.'))return;p.completedAt=Date.now();p.archived=true;addCompletionEvent('project','completed',p.name);if(data.lastMovement?.projectId===pid)data.lastMovement=null;if(!save())return;tab='history';render();celebrate('project')}}
function toggleTask(tid){const t=data.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;t.completedAt=t.done?Date.now():null;addCompletionEvent('task',t.done?'completed':'reopened',t.title);if(!save())return;if(t.done)celebrate('task');if(currentMission)openMission(currentMission);else if(currentProject)openProject(currentProject);else render()}}
function celebrate(kind){document.body.classList.remove('celebrate-'+kind);void document.body.offsetWidth;document.body.classList.add('celebrate-'+kind);setTimeout(()=>document.body.classList.remove('celebrate-'+kind),850)}
function startSession(pid,mid=''){
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 modal(`<p class="eyebrow">${cname(p.core)} / ${safe(p.name)}${m?' / '+safe(m.name):''}</p><h2>Registrar sesión</h2><p class="muted">Anotá el avance. El borrador se guarda automáticamente; podés volver después.</p><label>¿Qué hiciste?</label><textarea id="sDone" placeholder="Avances realizados..."></textarea><label>¿Cuál es el próximo paso?</label><textarea id="sNext" placeholder="La acción concreta para continuar..."></textarea><p class="small">● Guardado automático activado</p><div class="actions"><button class="btn" onclick="saveSession('${pid}','${mid}')">Guardar sesión</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields(key,['sDone','sNext']);
}
function saveSession(pid,mid=''){
 const done=document.getElementById('sDone').value.trim(),next=document.getElementById('sNext').value.trim();
 if(!done&&!next)return alert('Registrá al menos un dato.');
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 data.sessions.push({id:uid(),projectId:pid,missionId:mid||null,core:p.core,done,where:'',next,at:Date.now()});
 p.last=done;p.next=next;p.lastAt=Date.now();
 if(!save())return;
 clearDraft(key);closeModal();mid?openMission(mid):openProject(pid);
}
function archiveProject(pid){if(!confirm('¿Archivar este proyecto? Podrás restaurarlo desde Historial.'))return;const p=project(pid);p.archived=true;if(data.lastMovement?.projectId===pid){const fallback=data.projects.filter(x=>!x.archived&&x.lastAt).sort((a,b)=>b.lastAt-a.lastAt)[0];data.lastMovement=fallback?{core:fallback.core,projectId:fallback.id,at:fallback.lastAt}:null}save();showCore(p.core)}
function restoreProject(pid){project(pid).archived=false;save();render()}
function deleteProject(pid){const p=project(pid);if(!p||!confirm('¿Eliminar definitivamente este proyecto, sus misiones, tareas y sesiones?'))return;const mids=data.missions.filter(m=>m.projectId===pid).map(m=>m.id);data.projects=data.projects.filter(x=>x.id!==pid);const removedMissionIds=data.missions.filter(m=>m.projectId===pid).map(m=>m.id);data.missions=data.missions.filter(m=>m.projectId!==pid);data.missionFolders=(data.missionFolders||[]).filter(f=>!removedMissionIds.includes(f.missionId));data.tasks=data.tasks.filter(t=>t.projectId!==pid);data.sessions=data.sessions.filter(s=>s.projectId!==pid);if(data.lastMovement?.projectId===pid)data.lastMovement=null;save();closeModal();showCore(p.core)}
function deleteMission(mid){const m=mission(mid);if(!m||!confirm('¿Eliminar esta misión, sus tareas y sus sesiones?'))return;data.missions=data.missions.filter(x=>x.id!==mid);data.missionFolders=(data.missionFolders||[]).filter(f=>f.missionId!==mid);data.tasks=data.tasks.filter(t=>t.missionId!==mid);data.sessions=data.sessions.filter(s=>s.missionId!==mid);if(data.lastMovement?.missionId===mid)data.lastMovement={core:project(m.projectId)?.core,projectId:m.projectId,at:Date.now()};save();openProject(m.projectId)}
function deleteCore(k){const pids=data.projects.filter(p=>p.core===k).map(p=>p.id);if(!confirm('¿Eliminar definitivamente este núcleo y TODO su contenido: proyectos, misiones, tareas, ideas y sesiones? Esta acción no se puede deshacer.'))return;data.projects=data.projects.filter(p=>p.core!==k);data.missions=data.missions.filter(m=>!pids.includes(m.projectId));data.tasks=data.tasks.filter(t=>!pids.includes(t.projectId));data.sessions=data.sessions.filter(s=>s.core!==k&&!pids.includes(s.projectId));delete data.ideasByCore[k];data.deletedCores=[...new Set([...(data.deletedCores||[]),k])];if(data.coreNames)delete data.coreNames[k];if(data.coreDescs)delete data.coreDescs[k];if(data.coreIcons)delete data.coreIcons[k];if(data.coreColors)delete data.coreColors[k];if(data.lastMovement?.core===k)data.lastMovement=null;save();tab='cores';render()}
function allIdeas(){const list=(data.notes||[]).map(i=>({...i,source:'note'}));Object.entries(data.ideasByCore||{}).forEach(([core,arr])=>(arr||[]).forEach(i=>{if(!list.some(x=>x.id===i.id))list.push({...i,core,source:'core'});}));return list.sort((a,b)=>(b.at||0)-(a.at||0));}
function ideasPage(){const list=allIdeas();return `<div class="headline"><div><p class="eyebrow">CAPTURA Y CREACIÓN</p><h1>Ideas 💡</h1><p class="muted">Guardá ideas ahora y convertílas en misiones cuando estés listo.</p></div><button class="btn" onclick="newGlobalIdea()">＋ Idea</button></div>${list.length?list.map(i=>`<div class="idea-list-card"><b>${safe(i.title||'Idea')}</b><p>${safe(i.text)}</p><div class="idea-meta">${i.core?safe(coreName(i.core))+' · ':''}${i.at?fmt(i.at):''}</div><div class="actions"><button class="btn secondary" onclick="convertIdea('${i.id}','${i.source}','${i.core||''}')">Convertir en misión</button><button class="edit-icon" onclick="editGlobalIdea('${i.id}','${i.source}','${i.core||''}')" aria-label="Editar idea">✎</button><button class="edit-icon" onclick="deleteGlobalIdea('${i.id}','${i.source}','${i.core||''}')" aria-label="Eliminar idea">×</button></div></div>`).join(''):'<div class="empty">Todavía no guardaste ideas. Tocá «Idea» para capturar la primera.</div>'}`;}
function newGlobalIdea(){modal(`<h2>Nueva idea</h2><label>Título</label><input id="gIdeaTitle" placeholder="Nombre breve"><label>Idea</label><textarea id="gIdeaText" placeholder="Anotá lo que se te ocurrió..."></textarea><label>Núcleo (opcional)</label><select id="gIdeaCore"><option value="">Sin clasificar</option>${activeCores().map(c=>`<option value="${c[0]}">${safe(coreName(c[0]))}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveGlobalIdea()">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);bindDraftFields('global-idea',['gIdeaTitle','gIdeaText','gIdeaCore']);}
function saveGlobalIdea(){const text=document.getElementById('gIdeaText').value.trim();if(!text)return alert('Escribí la idea.');data.notes.push({id:uid(),title:document.getElementById('gIdeaTitle').value.trim(),text,core:document.getElementById('gIdeaCore').value,at:Date.now()});if(!save())return;clearDraft('global-idea');closeModal();tab='ideas';render();}
function findIdea(id,source,core){return source==='core'?coreIdeas(core).find(x=>x.id===id):(data.notes||[]).find(x=>x.id===id)}
function editGlobalIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;modal(`<h2>Editar idea</h2><label>Título</label><input id="gIdeaTitle" value="${safe(i.title||'')}"><label>Idea</label><textarea id="gIdeaText">${safe(i.text)}</textarea><div class="actions"><button class="btn" onclick="updateGlobalIdea('${id}','${source}','${core}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateGlobalIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;i.title=document.getElementById('gIdeaTitle').value.trim();i.text=document.getElementById('gIdeaText').value.trim();save();closeModal();tab='ideas';render()}
function deleteGlobalIdea(id,source,core){if(!confirm('¿Eliminar esta idea?'))return;if(source==='core')data.ideasByCore[core]=coreIdeas(core).filter(x=>x.id!==id);else data.notes=data.notes.filter(x=>x.id!==id);save();render()}
function convertIdea(id,source,core){const i=findIdea(id,source,core);if(!i)return;const projects=data.projects.filter(p=>!p.archived);modal(`<h2>Convertir idea en misión</h2><label>Núcleo</label><select id="ideaCore" onchange="refreshIdeaProjects()">${activeCores().map(c=>`<option value="${c[0]}" ${core&&c[0]===core?'selected':''}>${safe(coreName(c[0]))}</option>`).join('')}</select><label>Proyecto donde querés crearla</label><select id="ideaProject">${projects.map(p=>`<option value="${p.id}" ${core&&p.core===core?'selected':''}>${safe(coreName(p.core))} · ${safe(p.name)}</option>`).join('')}</select><label>Nombre de la misión</label><input id="ideaMissionName" value="${safe(i.title||i.text.slice(0,55))}"><label>Descripción</label><textarea id="ideaMissionDesc">${safe(i.text)}</textarea><div class="actions"><button class="btn" onclick="createMissionFromIdea('${id}','${source}','${core}')">Crear misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);refreshIdeaProjects();}function refreshIdeaProjects(){const coreId=document.getElementById('ideaCore')?.value;const sel=document.getElementById('ideaProject');if(!sel)return;const list=data.projects.filter(p=>!p.archived&&p.core===coreId);sel.innerHTML=list.map(p=>`<option value="${p.id}">${safe(p.name)}</option>`).join('');if(!list.length)sel.innerHTML='<option value="">No hay proyectos en este núcleo</option>';}
function createMissionFromIdea(id,source,core){const pid=document.getElementById('ideaProject').value;if(!pid)return alert('Primero creá un proyecto.');const p=project(pid);const name=document.getElementById('ideaMissionName').value.trim();if(!name)return alert('Poné un nombre a la misión.');const order=data.missions.filter(m=>m.projectId===pid).length;data.missions.push({id:uid(),projectId:pid,name,description:document.getElementById('ideaMissionDesc').value.trim(),icon:'✦',order,created:Date.now()});const i=findIdea(id,source,core);if(i)i.convertedTo=pid;save();closeModal();tab='project';openProject(pid);}
function openIdeas(k){currentCore=k;touchCore(k);const ideas=coreIdeas(k);document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${k}')">← ${safe(coreName(k))}</button><div class="row between section-head"><div><p class="eyebrow">${safe(coreName(k))}</p><h1>Ideas</h1></div><span class="idea-bulb">💡</span></div><button class="btn" onclick="newCoreIdea('${k}')">＋ Nueva idea</button><div class="panel">${ideas.length?ideas.slice().sort((a,b)=>b.at-a.at).map(i=>`<div class="idea-card"><b>${safe(i.title||'Idea')}</b><p>${safe(i.text)}</p><div class="small">${fmt(i.at)}</div><div class="idea-actions"><button class="edit-icon" onclick="editCoreIdea('${k}','${i.id}')" aria-label="Editar idea">✎</button><button class="edit-icon" onclick="deleteCoreIdea('${k}','${i.id}')" aria-label="Eliminar idea">×</button></div></div>`).join(''):'<div class="empty">Todavía no hay ideas en este núcleo.</div>'}</div>`}
function newCoreIdea(k){modal(`<h2>Nueva idea</h2><label>Título</label><input id="ideaTitle" placeholder="Nombre breve"><label>Idea</label><textarea id="ideaText" placeholder="Desarrollá la idea..."></textarea><div class="actions"><button class="btn" onclick="saveCoreIdea('${k}')">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveCoreIdea(k){const text=document.getElementById('ideaText').value.trim();if(!text)return alert('Escribí la idea.');if(!data.ideasByCore[k])data.ideasByCore[k]=[];data.ideasByCore[k].push({id:uid(),title:document.getElementById('ideaTitle').value.trim(),text,at:Date.now()});save();closeModal();openIdeas(k)}
function editCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;modal(`<h2>Editar idea</h2><label>Título</label><input id="ideaTitle" value="${safe(i.title||'')}"><label>Idea</label><textarea id="ideaText">${safe(i.text)}</textarea><div class="actions"><button class="btn" onclick="updateCoreIdea('${k}','${id}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;i.title=document.getElementById('ideaTitle').value.trim();i.text=document.getElementById('ideaText').value.trim();save();closeModal();openIdeas(k)}
function deleteCoreIdea(k,id){if(!confirm('¿Eliminar esta idea?'))return;data.ideasByCore[k]=coreIdeas(k).filter(x=>x.id!==id);save();openIdeas(k)}
function quickCapture(){
 modal(`<h2>Captura rápida</h2><p class="muted">La idea se guarda como borrador mientras escribís.</p><label>Idea o pendiente</label><textarea id="noteText" placeholder="Escribí acá..."></textarea><label>Núcleo</label><select id="noteCore"><option value="">Sin clasificar</option>${activeCores().map(c=>`<option value="${c[0]}">${safe(coreName(c[0]))}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveNote()">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields('quick-note',['noteText','noteCore']);
}
function saveNote(){const text=document.getElementById('noteText').value.trim();if(!text)return alert('Escribí una idea.');data.notes.push({id:uid(),text,core:document.getElementById('noteCore').value,at:Date.now()});if(!save())return;clearDraft('quick-note');closeModal();alert('Idea guardada.')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoy-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.projects)||!Array.isArray(x.tasks))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){data={...x,projects:x.projects,tasks:x.tasks,sessions:x.sessions||[],missions:x.missions||[],notes:x.notes||[],ideasByCore:x.ideasByCore||{},deletedCores:x.deletedCores||[]};save();render();alert('Copia restaurada.')}}catch{alert('El archivo no parece una copia válida de HOY.')}};r.readAsText(f)}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
document.getElementById('backup').onclick=exportData;
loadAdviceSources().then(()=>{chooseAdviceOnLaunch();initTheme();render();});
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}});
if('serviceWorker' in navigator && location.protocol!=='file:'){
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__hoySwReloading){window.__hoySwReloading=true;location.reload();}});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
</script>
</body></html>
