<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOY">
<link rel="manifest" href="manifest.webmanifest">
<title>HOY</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1c1c1c;--line:#353535;--muted:#999;--text:#f5f5f5;--accent:#e7ed45}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 90px}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;position:sticky;top:0;background:#101010ee;backdrop-filter:blur(12px);z-index:2}
.logo{font-size:28px;font-weight:850;letter-spacing:-1px}.caption{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
main{max-width:720px;margin:auto;padding:18px 16px}h1{font-size:27px;margin:5px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}
.muted,.small{color:var(--muted)}.small{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.core{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;text-align:left;padding:15px;min-height:112px}.core strong{display:block;margin:9px 0 4px;font-size:18px}.core span{font-size:12px;color:var(--muted)}
.tom{border-top:3px solid #6ca887}.aso{border-top:3px solid #9c8be2}.rub{border-top:3px solid #d27d9d}.god{border-top:3px solid #aaa}
.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:#111;font-weight:700}.secondary{background:#292929;color:var(--text);border:1px solid #444}.ghost{background:transparent;color:var(--text);border:1px solid #444}.danger{background:#482525;color:#ffe0e0}
input,textarea,select{width:100%;background:#111;color:var(--text);border:1px solid #444;border-radius:11px;padding:12px}textarea{min-height:80px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #333}.item:last-child{border:0}
.tag{font-size:10px;background:var(--accent);color:#111;border-radius:20px;padding:4px 8px;font-weight:700}.empty{border:1px dashed #444;border-radius:13px;padding:20px;text-align:center;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#191919f5;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px}.nav button.active{color:var(--accent)}.nav b{font-size:22px;font-weight:500}.nav .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#111;font-size:28px;justify-content:center}
.modal{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:flex-end;justify-content:center;padding:10px}.sheet{width:min(100%,680px);max-height:90vh;overflow:auto;background:#1d1d1d;border:1px solid #444;border-radius:22px;padding:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.check{width:auto;accent-color:var(--accent);margin-right:8px}.progress{height:6px;background:#333;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<header><div><div class="logo">HOY<span style="color:var(--accent)">.</span></div><div class="caption">TU SISTEMA DE CONTINUIDAD</div></div><button class="btn secondary" id="backup">Exportar copia</button></header>
<main id="app"></main>
<nav class="nav">
<button data-tab="today" class="active"><b>⌂</b>Hoy</button>
<button data-tab="cores"><b>▦</b>Núcleos</button>
<button class="plus" id="add">+</button>
<button data-tab="history"><b>◷</b>Historial</button>
</nav>
<div id="modal"></div>
<script>
const KEY='hoy-data-v1';
const cores=[['tomas','TOMÁS','Cuerpo · Mente · Alma','tom','◉'],['asoka','ASOKA','Música · Videoclips','aso','♫'],['ruby','RUBY','Grupo · Eventos · Contenido','rub','✳'],['godd','GODD','Ropa · Merchandising','god','◇']];
let data=read(),tab='today',currentCore=null,currentProject=null;
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],tasks:[],sessions:[],notes:[]}}catch{return {projects:[],tasks:[],sessions:[],notes:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cname(k){return cores.find(c=>c[0]===k)?.[1]||k}
function fmt(d){return new Date(d).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function project(id){return data.projects.find(p=>p.id===id)}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const app=document.getElementById('app');
 if(tab==='today') app.innerHTML=today();
 if(tab==='cores') app.innerHTML=corePage();
 if(tab==='history') app.innerHTML=historyPage();
}
function today(){
 const active=data.projects.filter(p=>!p.archived);
 const priorities=data.tasks.filter(t=>!t.done&&t.priority==='Alta').slice(0,3);
 const recent=[...data.projects].filter(p=>!p.archived&&p.lastAt).sort((a,b)=>b.lastAt-a.lastAt)[0];
 return `<p class="small">CENTRO DE CONTROL</p><h1>¿Qué vamos a avanzar?</h1><p class="muted">Un paso concreto a la vez.</p>
 <div class="panel"><div class="row between"><h2>Continuar donde quedaste</h2><span class="tag">${recent?'RECIENTE':'INICIO'}</span></div>${recent?`<h3>${safe(recent.name)}</h3><p class="small">${cname(recent.core)} · ${recent.next?safe(recent.next):'Todavía no hay próximo paso registrado'}</p><button class="btn" onclick="openProject('${recent.id}')">Continuar proyecto</button>`:`<p class="muted">Todavía no hay proyectos con actividad. Creá uno para empezar.</p><button class="btn" onclick="newProject()">Crear proyecto</button>`}</div>
 <div class="panel"><div class="row between"><h2>Prioridades</h2><span class="small">${priorities.length}/3</span></div>${priorities.length?priorities.map(t=>`<div class="item"><label><input class="check" type="checkbox" onchange="toggleTask('${t.id}')">${safe(t.title)}</label><div class="small">${cname(project(t.projectId)?.core)}</div></div>`).join(''):'<p class="muted">No hay prioridades altas pendientes.</p>'}</div>
 <div class="row between"><h2>Tus núcleos</h2><button class="btn ghost" onclick="tab='cores';render()">Ver todos</button></div><div class="grid">${cores.map(c=>`<button class="core ${c[3]}" onclick="showCore('${c[0]}')"><div>${c[4]}</div><strong>${c[1]}</strong><span>${c[2]}</span></button>`).join('')}</div>
 <div class="panel"><div class="row between"><h2>Actividad</h2><span class="small">${data.sessions.length} sesiones</span></div><p class="small">Proyectos activos: ${active.length} · Tareas pendientes: ${data.tasks.filter(t=>!t.done).length}</p></div>`;
}
function corePage(){return `<p class="small">ESPACIOS DE TRABAJO</p><h1>Núcleos</h1><p class="muted">Cada núcleo mantiene sus proyectos e historial.</p><div class="grid">${cores.map(c=>`<button class="core ${c[3]}" onclick="showCore('${c[0]}')"><div>${c[4]}</div><strong>${c[1]}</strong><span>${c[2]}</span><p class="small">${data.projects.filter(p=>p.core===c[0]&&!p.archived).length} proyectos activos</p></button>`).join('')}</div>`}
function showCore(k){currentCore=k;tab='core';renderCore()}
function renderCore(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',false));document.getElementById('app').innerHTML=coreDetail(currentCore)}
function coreDetail(k){const c=cores.find(x=>x[0]===k);const ps=data.projects.filter(p=>p.core===k&&!p.archived);return `<button class="btn ghost" onclick="tab='cores';render()">← Núcleos</button><p class="small">${c[1]}</p><h1>${c[2]}</h1><div class="row between"><h2>Proyectos</h2><button class="btn" onclick="newProject('${k}')">+ Proyecto</button></div>${ps.length?ps.map(p=>projectCard(p)).join(''):'<div class="empty">Todavía no hay proyectos en este núcleo.</div>'}`}
function projectCard(p){const tasks=data.tasks.filter(t=>t.projectId===p.id);return `<div class="panel"><div class="row between"><h3>${safe(p.name)}</h3><span class="tag">${tasks.filter(t=>t.done).length}/${tasks.length}</span></div><p class="small">${p.lastAt?'Última actividad: '+fmt(p.lastAt):'Sin sesiones registradas'}</p>${p.next?`<p><b>Próximo paso:</b> ${safe(p.next)}</p>`:''}<div class="actions"><button class="btn" onclick="openProject('${p.id}')">Abrir</button><button class="btn secondary" onclick="newTask('${p.id}')">+ Tarea</button></div></div>`}
function openProject(pid){currentProject=pid;const p=project(pid);if(!p)return;tab='project';document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${p.core}')">← ${cname(p.core)}</button><p class="small">${cname(p.core)}</p><h1>${safe(p.name)}</h1><p class="muted">${safe(p.description||'Sin descripción')}</p><div class="panel"><div class="row between"><h2>Continuidad</h2><span class="tag">${p.lastAt?'EN MARCHA':'NUEVO'}</span></div><p><b>Último avance</b><br>${safe(p.last||'Todavía no registrado')}</p><p><b>Próximo paso</b><br>${safe(p.next||'Definir próximo paso')}</p><button class="btn" onclick="startSession('${p.id}')">Continuar sesión</button></div><div class="row between"><h2>Tareas</h2><button class="btn secondary" onclick="newTask('${p.id}')">+ Tarea</button></div>${data.tasks.filter(t=>t.projectId===p.id).map(t=>`<div class="item"><label><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">${safe(t.title)}</label><div class="small">${t.priority} · ${t.done?'Completada':'Pendiente'}</div></div>`).join('')||'<div class="empty">No hay tareas todavía.</div>'}<div class="actions"><button class="btn ghost" onclick="editProject('${p.id}')">Editar</button><button class="btn ghost" onclick="archiveProject('${p.id}')">Archivar</button></div><hr><h2>Registros del proyecto</h2>${data.sessions.filter(s=>s.projectId===p.id).slice().reverse().map(s=>`<div class="item"><b>${fmt(s.at)}</b><p>${safe(s.done)}</p><p class="small">Siguiente: ${safe(s.next)}</p></div>`).join('')||'<p class="muted">Todavía no hay registros.</p>'}`}
function historyPage(){const sessions=data.sessions.slice().reverse();const archived=data.projects.filter(p=>p.archived);return `<p class="small">MEMORIA DE TRABAJO</p><h1>Historial</h1><div class="panel"><h2>Sesiones registradas</h2>${sessions.length?sessions.map(s=>`<div class="item"><b>${safe(project(s.projectId)?.name||'Proyecto archivado')}</b><p>${safe(s.done)}</p><div class="small">${cname(s.core)} · ${fmt(s.at)}</div></div>`).join(''):'<div class="empty">Todavía no hay sesiones guardadas.</div>'}</div><div class="panel"><h2>Proyectos archivados</h2>${archived.length?archived.map(p=>`<div class="item row between"><div><b>${safe(p.name)}</b><div class="small">${cname(p.core)}</div></div><button class="btn secondary" onclick="restoreProject('${p.id}')">Restaurar</button></div>`).join(''):'<p class="muted">No hay proyectos archivados.</p>'}</div><div class="panel"><h2>Copia de seguridad</h2><p class="small">Tus datos se guardan en este navegador. Exportá una copia periódicamente para no perderlos.</p><button class="btn secondary" onclick="exportData()">Descargar copia JSON</button><label>Restaurar copia</label><input type="file" accept="application/json" onchange="importData(event)"></div>`}
function modal(content){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newProject(core=currentCore||'tomas'){modal(`<h2>Nuevo proyecto</h2><label>Núcleo</label><select id="pCore">${cores.map(c=>`<option value="${c[0]}" ${c[0]===core?'selected':''}>${c[1]}</option>`).join('')}</select><label>Nombre</label><input id="pName" placeholder="Ej. Videoclip nuevo"><label>Descripción</label><textarea id="pDesc" placeholder="¿De qué se trata?"></textarea><div class="actions"><button class="btn" onclick="saveProject()">Crear proyecto</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProject(){const name=document.getElementById('pName').value.trim();if(!name)return alert('Escribí un nombre.');const p={id:uid(),core:document.getElementById('pCore').value,name,description:document.getElementById('pDesc').value.trim(),created:Date.now(),archived:false,last:'',next:'',lastAt:null};data.projects.push(p);save();closeModal();currentCore=p.core;renderCore()}
function editProject(pid){const p=project(pid);modal(`<h2>Editar proyecto</h2><label>Nombre</label><input id="eName" value="${safe(p.name)}"><label>Descripción</label><textarea id="eDesc">${safe(p.description)}</textarea><div class="actions"><button class="btn" onclick="updateProject('${pid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProject(pid){const p=project(pid);p.name=document.getElementById('eName').value.trim()||p.name;p.description=document.getElementById('eDesc').value;save();closeModal();openProject(pid)}
function newTask(pid){modal(`<h2>Nueva tarea</h2><label>Tarea</label><input id="tTitle" placeholder="¿Qué hay que hacer?"><label>Prioridad</label><select id="tPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><div class="actions"><button class="btn" onclick="saveTask('${pid}')">Guardar tarea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTask(pid){const title=document.getElementById('tTitle').value.trim();if(!title)return alert('Escribí una tarea.');data.tasks.push({id:uid(),projectId:pid,title,priority:document.getElementById('tPriority').value,done:false,created:Date.now()});save();closeModal();openProject(pid)}
function toggleTask(tid){const t=data.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;save();render()}}
function startSession(pid){const p=project(pid);modal(`<h2>Finalizar sesión</h2><p class="muted">Registrá el avance para poder retomarlo después.</p><label>¿Qué hiciste?</label><textarea id="sDone" placeholder="Avances realizados..."></textarea><label>¿Dónde te quedaste?</label><textarea id="sWhere" placeholder="Estado actual..."></textarea><label>¿Cuál es el próximo paso?</label><textarea id="sNext" placeholder="La acción concreta para continuar..."></textarea><div class="actions"><button class="btn" onclick="saveSession('${pid}')">Guardar y finalizar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveSession(pid){const done=document.getElementById('sDone').value.trim(),where=document.getElementById('sWhere').value.trim(),next=document.getElementById('sNext').value.trim();if(!done&&!where&&!next)return alert('Registrá al menos un dato.');const p=project(pid);data.sessions.push({id:uid(),projectId:pid,core:p.core,done,where,next,at:Date.now()});p.last=where||done;p.next=next;p.lastAt=Date.now();save();closeModal();openProject(pid)}
function archiveProject(pid){if(!confirm('¿Archivar este proyecto? Podrás restaurarlo desde Historial.'))return;project(pid).archived=true;save();showCore(project(pid).core)}
function restoreProject(pid){project(pid).archived=false;save();render()}
function quickCapture(){modal(`<h2>Captura rápida</h2><p class="muted">Guardá una idea para clasificarla después.</p><label>Idea o pendiente</label><textarea id="noteText" placeholder="Escribí acá..."></textarea><label>Núcleo</label><select id="noteCore"><option value="">Sin clasificar</option>${cores.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveNote()">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveNote(){const text=document.getElementById('noteText').value.trim();if(!text)return alert('Escribí una idea.');data.notes.push({id:uid(),text,core:document.getElementById('noteCore').value,at:Date.now()});save();closeModal();alert('Idea guardada.')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoy-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.projects)||!Array.isArray(x.tasks))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){data={projects:x.projects,tasks:x.tasks,sessions:x.sessions||[],notes:x.notes||[]};save();render();alert('Copia restaurada.')}}catch{alert('El archivo no parece una copia válida de HOY.')}};r.readAsText(f)}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
document.getElementById('add').onclick=quickCapture;document.getElementById('backup').onclick=exportData;
render();
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body></html>
