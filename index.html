<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOY">
<link rel="manifest" href="manifest.webmanifest">
<title>HOY</title>
<style>
:root{color-scheme:light;--bg:#eaf4f8;--panel:#fff;--line:#d8e5e9;--muted:#71828b;--text:#29485a;--accent:#c99b4b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 90px}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;position:sticky;top:0;background:#101010ee;backdrop-filter:blur(12px);z-index:2}
.logo{font-size:28px;font-weight:850;letter-spacing:-1px}.caption{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
main{max-width:720px;margin:auto;padding:18px 16px}h1{font-size:27px;margin:5px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}
.muted,.small{color:var(--muted)}.small{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.core{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;text-align:left;padding:15px;min-height:112px}.core strong{display:block;margin:9px 0 4px;font-size:18px}.core span{font-size:12px;color:var(--muted)}
.tom{border-top:3px solid #6ca887}.aso{border-top:3px solid #9c8be2}.rub{border-top:3px solid #d27d9d}.god{border-top:3px solid #aaa}
.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--accent);color:#111;font-weight:700}.secondary{background:#292929;color:var(--text);border:1px solid #444}.ghost{background:transparent;color:var(--text);border:1px solid #444}.danger{background:#482525;color:#ffe0e0}
input,textarea,select{width:100%;background:#111;color:var(--text);border:1px solid #444;border-radius:11px;padding:12px}textarea{min-height:80px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid #333}.item:last-child{border:0}
.tag{font-size:10px;background:var(--accent);color:#111;border-radius:20px;padding:4px 8px;font-weight:700}.empty{border:1px dashed #444;border-radius:13px;padding:20px;text-align:center;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#191919f5;border-top:1px solid #333;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px}.nav button.active{color:var(--accent)}.nav b{font-size:22px;font-weight:500}.nav .plus{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#111;font-size:28px;justify-content:center}
.modal{position:fixed;inset:0;background:#000b;z-index:8;display:flex;align-items:flex-end;justify-content:center;padding:10px}.sheet{width:min(100%,680px);max-height:90vh;overflow:auto;background:#1d1d1d;border:1px solid #444;border-radius:22px;padding:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.check{width:auto;accent-color:var(--accent);margin-right:8px}.progress{height:6px;background:#333;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.save-ok{color:#8bd5a8}.save-pending{color:#e7ed45}.save-error{color:#ff8585}
.text-button{background:none;border:0;color:inherit;padding:0;text-align:left;font:inherit;font-weight:650;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.project-card,.mission-card{width:100%;text-align:left;color:var(--text);background:linear-gradient(145deg,#222 0%,#191919 100%);border:1px solid #3b3b3b;border-radius:20px;padding:18px;margin:8px 0;box-shadow:0 8px 22px #0002;transition:transform .15s,border-color .15s}
.project-card:active,.mission-card:active{transform:scale(.985);border-color:var(--accent)}
.project-card h3,.mission-card h3{font-size:22px;margin:12px 0 5px}
.mission-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mission-card{margin:0;min-height:170px;display:flex;flex-direction:column;gap:9px}
.mission-card h3{font-size:18px;margin:0}
.mission-icon{width:42px;height:42px;border-radius:14px;background:#e7ed4520;color:var(--accent);display:grid;place-items:center;font-size:23px}
.mission-icon.large{width:58px;height:58px;font-size:30px}
.mission-hero{padding:22px;border:1px solid #3a3a3a;border-radius:22px;background:radial-gradient(circle at 90% 0%,#e7ed4520,transparent 45%),#1b1b1b;margin:14px 0 22px}
.eyebrow{font-size:11px;letter-spacing:1.7px;color:#aaa;text-transform:uppercase}
.section-head{margin:24px 0 12px}
.task-list{background:#1b1b1b;border:1px solid #383838;border-radius:18px;padding:4px 14px}
.task-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #333}
.task-row:last-child{border-bottom:0}
.task-row label{display:flex;align-items:center;gap:8px;min-width:0}
.completed{text-decoration:line-through;color:#888}
.continuity{background:linear-gradient(120deg,#222,#191919)}

body{background:linear-gradient(180deg,#eaf4f8 0%,#f7fbfc 52%,#e7f1f5 100%);color:var(--text)}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url('hoy_cielo_nubes.jpg') center 25%/cover no-repeat;opacity:.27;filter:blur(1.5px)}
header{background:#f6fbfbed;border-bottom:1px solid #d8e7ec;backdrop-filter:blur(16px)}
.logo{font-family:Georgia,'Times New Roman',serif;font-size:31px;font-weight:500;letter-spacing:1.2px;color:#31566a;display:flex;align-items:center;gap:4px}.sun-logo{width:30px;height:27px;object-fit:contain}
.caption,.muted,.small{color:#718791}h1,h2,h3{color:#29485a}
.panel,.core,.project-card,.mission-card,.task-list{background:#fffdf5c9;border-color:#e4d6b9;box-shadow:0 8px 24px #8b6b3212}
.panel{border-radius:19px;backdrop-filter:blur(8px)}.core{color:#29485a;border-radius:18px}
.tom{border-top:3px solid #91b9c7}.aso{border-top:3px solid #86a9c7}.rub{border-top:3px solid #c89ca7}.god{border-top:3px solid #c9a66d}
.btn{background:#c99b4b;color:#fff;border-radius:13px}.secondary{background:#eaf2f5;color:#31566a;border:1px solid #d4e3e8}.ghost{background:#ffffff90;color:#426477;border:1px solid #cadce2}.danger{background:#f8e8e5;color:#8b4840}
input,textarea,select{background:#f8fbfc;color:#29485a;border:1px solid #d4e2e7}label{color:#71828b}
.nav{background:#f8fbfcf2;border-top:1px solid #dce8ec;backdrop-filter:blur(16px)}.nav button.active{color:#a77a32}.nav .plus{background:#c99b4b;color:white}
.modal{background:#25485a55}.sheet{background:#f9fcfd;border-color:#d5e3e8;color:#29485a}.tag{background:#f1e3c8;color:#85632e}
.progress{background:#e5eef1}.progress i{background:linear-gradient(90deg,#8bbdce,#c99b4b)}.mission-icon{background:#f4ead6;color:#a77a32}
.mission-hero{background:linear-gradient(110deg,#f7fbfce8,#eaf3f6d9),url('hoy_cielo_nubes.jpg') center 45%/cover;border-color:#d7e5e9}.continuity{background:linear-gradient(110deg,#f6fafbe8,#eaf3f6e8),url('hoy_cielo_nubes.jpg') center/cover}
.task-list{background:#fffdf5c4}.task-row{border-color:#e7eef0}.item{border-color:#e4ecef}.empty{border-color:#d5e3e8}
.idea-entry{display:flex;align-items:center;gap:10px;padding:13px 14px;margin:14px 0;border:1px solid #dfc99e;border-radius:16px;background:#fff8e9c9;color:#8d682f;text-align:left;width:100%}.idea-bulb{font-size:24px}.idea-card{padding:12px 0;border-bottom:1px solid #eadfc9}.idea-card:last-child{border-bottom:0}.idea-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:7px}.edit-icon{width:30px;height:30px;border:0;border-radius:50%;display:inline-grid;place-items:center;background:#edf4f6;color:#688592;font-size:16px;flex:none;padding:0}
.headline{display:flex;align-items:center;justify-content:space-between;gap:8px}.recent-compact{padding:12px 14px;margin:12px 0;border:1px solid #dce8ec;border-radius:16px;background:#fffaf0a8;backdrop-filter:blur(7px)}.recent-compact h2{font-size:15px;margin:0;color:#607d8b}.recent-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.subtask-list{padding:5px 0 0 27px}.subtask{display:flex;align-items:center;gap:7px;padding:6px 0;color:#71828b;font-size:13px}.subtask input{width:auto}.task-main{min-width:0;flex:1}.task-actions{display:flex;gap:5px;align-items:center}
.project-card,.mission-card{color:#29485a;background:#fffdf5c9;border-color:#e5d7bb}.project-card h3,.mission-card h3{color:#29485a}
@media(max-width:390px){main{padding:15px 13px}.mission-grid{gap:8px}.mission-card{padding:13px;min-height:155px}}
</style>
</head>
<body>
<header><div><div class="logo">HOY <img class="sun-logo" src="hoy_sol_original.png" alt="Sol original"></div><div class="caption">TU SISTEMA DE CONTINUIDAD</div></div><div class="row"><span id="saveStatus" class="small" aria-live="polite">● Guardado</span><button class="btn secondary" id="backup">Exportar copia</button></div></header>
<main id="app"></main>
<nav class="nav">
<button data-tab="today" class="active"><b>⌂</b>Hoy</button>
<button data-tab="cores"><b>▦</b>Núcleos</button>
<button class="plus" id="add">+</button>
<button data-tab="history"><b>◷</b>Historial</button>
</nav>
<div id="modal"></div>
<script>
const KEY='hoy-data-v1';
const cores=[['tomas','TOMÁS','Cuerpo · Mente · Alma','tom','◉'],['asoka','ASOKA','Música · Videoclips','aso','♫'],['ruby','RUBY','Grupo · Eventos · Contenido','rub','✳'],['godd','GODD','Ropa · Merchandising','god','◇']];
let data=read(),tab='today',currentCore=null,currentProject=null,currentMission=null;
if(!Array.isArray(data.missions))data.missions=[];if(!Array.isArray(data.sessions))data.sessions=[];if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.projects))data.projects=[];if(!Array.isArray(data.notes))data.notes=[];if(!data.ideasByCore)data.ideasByCore={};if(!Array.isArray(data.deletedCores))data.deletedCores=[];
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],tasks:[],sessions:[],notes:[]}}catch{return {projects:[],tasks:[],sessions:[],notes:[]}}}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(data));setSaveStatus('Guardado','ok');return true}
 catch(e){setSaveStatus('Error al guardar','error');return false}
}
const DRAFT_KEY='hoy-drafts-v1';
function setSaveStatus(label,state='ok'){
 const el=document.getElementById('saveStatus');
 if(el){el.textContent='● '+label;el.className='small '+(state==='error'?'save-error':state==='pending'?'save-pending':'save-ok')}
}
function readDrafts(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY))||{}}catch(e){return {}}}
function writeDraft(key,value){
 setSaveStatus('Guardando…','pending');
 try{const drafts=readDrafts();drafts[key]={value,updatedAt:Date.now()};localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));setSaveStatus('Borrador guardado','ok')}
 catch(e){setSaveStatus('Error al guardar','error')}
}
function getDraft(key){return readDrafts()[key]?.value||{}}
function clearDraft(key){const drafts=readDrafts();delete drafts[key];try{localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}catch(e){}}
function bindDraftFields(key,ids){
 const draft=getDraft(key);
 ids.forEach(id=>{
  const el=document.getElementById(id);if(!el)return;
  if(draft[id]!==undefined)el.value=draft[id];
  el.addEventListener('input',()=>{
   const value={};ids.forEach(field=>{const node=document.getElementById(field);if(node)value[field]=node.value});
   writeDraft(key,value);
  });
 });
}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coreName(k){return data.coreNames?.[k]||cores.find(c=>c[0]===k)?.[1]||k}
function coreDesc(k){return data.coreDescs?.[k]||cores.find(c=>c[0]===k)?.[2]||''}
function cname(k){return coreName(k)}
function fmt(d){return new Date(d).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function project(id){return data.projects.find(p=>p.id===id)}
function mission(id){return data.missions.find(m=>m.id===id)}
function missionTasks(id){return data.tasks.filter(t=>t.missionId===id)}
function activeCores(){return cores.filter(c=>!(data.deletedCores||[]).includes(c[0]))}
function touchCore(k,projectId=null,missionId=null){data.lastMovement={core:k,projectId,missionId,at:Date.now()};save()}
function coreIdeas(k){return Array.isArray(data.ideasByCore[k])?data.ideasByCore[k]:[]}
function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const app=document.getElementById('app');
 if(tab==='today') app.innerHTML=today();
 if(tab==='cores') app.innerHTML=corePage();
 if(tab==='history') app.innerHTML=historyPage();
}
function today(){
 const active=data.projects.filter(p=>!p.archived);
 const priorities=data.tasks.filter(t=>!t.done&&t.priority==='Alta').slice(0,3);
 const lm=data.lastMovement;
 const recentCore=lm&&activeCores().some(c=>c[0]===lm.core)?lm.core:null;
 const recentTasks=priorities.map(t=>{const p=project(t.projectId),m=t.missionId?mission(t.missionId):null;return `<div class="item"><button class="text-button" onclick="${m?`openMission('${m.id}')`:`openProject('${t.projectId}')`}">${safe(t.title)}</button><div class="small">${p?cname(p.core)+' · '+safe(p.name):'Proyecto'}${m?' · '+safe(m.name):''}</div></div>`}).join('');
 return `<p class="small">CENTRO DE CONTROL</p><h1>¿Qué vamos a avanzar?</h1><p class="muted">Un paso concreto a la vez.</p>
 <div class="recent-compact"><div class="headline"><h2>Últimos movimientos</h2><span class="small">Último núcleo</span></div>${recentCore?`<div class="recent-entry"><div><b>${safe(coreName(recentCore))}</b><div class="small">${lm.projectId&&project(lm.projectId)&&!project(lm.projectId).archived?safe(project(lm.projectId).name):'Último espacio de trabajo'}<br>${lm.at?fmt(lm.at):''}</div></div><button class="btn secondary" onclick="showCore('${recentCore}')">Abrir</button></div>`:'<div class="recent-entry"><span class="small">Todavía no hay actividad registrada.</span></div>'}</div>
 <div class="panel"><div class="row between"><h2>Prioridades</h2><span class="small">${priorities.length}/3</span></div>${priorities.length?recentTasks:'<p class="muted">No hay prioridades altas pendientes.</p>'}</div>
 <div class="row between"><h2>Tus núcleos</h2><button class="btn ghost" onclick="tab='cores';render()">Ver todos</button></div><div class="grid">${activeCores().map(c=>`<button class="core ${c[3]}" onclick="showCore('${c[0]}')"><div>${c[4]}</div><strong>${safe(coreName(c[0]))}</strong><span>${safe(coreDesc(c[0]))}</span><span class="edit-icon" onclick="event.stopPropagation();editCore('${c[0]}')">✎</span></button>`).join('')}</div>
 <div class="panel"><div class="row between"><h2>Actividad</h2><span class="small">${data.sessions.length} sesiones</span></div><p class="small">Proyectos activos: ${active.length} · Tareas pendientes: ${data.tasks.filter(t=>!t.done).length}</p></div>`;
}
function corePage(){return `<p class="small">ESPACIOS DE TRABAJO</p><h1>Núcleos</h1><p class="muted">Cada núcleo mantiene sus proyectos e historial.</p><div class="grid">${activeCores().map(c=>`<button class="core ${c[3]}" onclick="showCore('${c[0]}')"><div>${c[4]}</div><strong>${safe(coreName(c[0]))}</strong><span>${safe(coreDesc(c[0]))}</span><p class="small">${data.projects.filter(p=>p.core===c[0]&&!p.archived).length} proyectos activos</p><span class="edit-icon" onclick="event.stopPropagation();editCore('${c[0]}')">✎</span></button>`).join('')}</div>`}
function showCore(k){currentCore=k;tab='core';touchCore(k);renderCore()}
function renderCore(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',false));document.getElementById('app').innerHTML=coreDetail(currentCore)}
function coreDetail(k){const c=cores.find(x=>x[0]===k);const ps=data.projects.filter(p=>p.core===k&&!p.archived);return `<button class="btn ghost" onclick="tab='cores';render()">← Núcleos</button><div class="headline"><div><p class="small">${safe(coreName(c[0]))}</p><h1>${safe(coreDesc(c[0]))}</h1></div><button class="edit-icon" onclick="editCore('${k}')" aria-label="Editar núcleo">✎</button></div><button class="idea-entry" onclick="openIdeas('${k}')"><span class="idea-bulb">💡</span><span><b>Ideas</b><br><span class="small">Abrir el espacio de ideas de este núcleo</span></span></button><div class="row between"><h2>Proyectos</h2><button class="btn" onclick="newProject('${k}')">+ Proyecto</button></div>${ps.length?ps.map(p=>projectCard(p)).join(''):'<div class="empty">Todavía no hay proyectos en este núcleo.</div>'}<div class="actions"><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`}
function projectCard(p){
 const ms=data.missions.filter(m=>m.projectId===p.id), oldTasks=data.tasks.filter(t=>t.projectId===p.id&&!t.missionId);
 const total=data.tasks.filter(t=>t.projectId===p.id).length,done=data.tasks.filter(t=>t.projectId===p.id&&t.done).length;
 return `<div class="project-card" onclick="openProject('${p.id}')"><div class="headline"><span class="eyebrow">${cname(p.core)} / PROYECTO</span><button class="edit-icon" onclick="event.stopPropagation();editProject('${p.id}')" aria-label="Editar proyecto">✎</button></div><div class="row between"><h3>${safe(p.name)}</h3><span class="tag">${done}/${total}</span></div><p class="small">${safe(p.description||'Espacio de trabajo')}</p><div class="row between small"><span>${ms.length} misiones</span><span>${p.lastAt?'Actividad '+fmt(p.lastAt):'Sin actividad'}</span></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div></div>`;
}
function openProject(pid){
 currentProject=pid;const p=project(pid);if(!p)return;tab='project';touchCore(p.core,pid);
 const ms=data.missions.filter(m=>m.projectId===pid);
 const oldTasks=data.tasks.filter(t=>t.projectId===pid&&!t.missionId);
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${p.core}')">← ${cname(p.core)}</button><p class="eyebrow">${cname(p.core)} / PROYECTO</p><div class="headline"><h1>${safe(p.name)}</h1><button class="edit-icon" onclick="editProject('${p.id}')">✎</button></div><p class="muted">${safe(p.description||'')}</p>
 <div class="continuity panel"><div class="row between"><h2>Continuidad</h2><span class="tag">${p.lastAt?'ACTIVO':'NUEVO'}</span></div><p class="small">${safe(p.next||'Elegí una misión para empezar.')}</p><button class="btn" onclick="startSession('${p.id}')">＋ Registrar sesión</button></div>
 <div class="row between section-head"><div><h2>Misiones</h2><p class="small">Dividí el proyecto en partes de trabajo.</p></div><button class="btn" onclick="newMission('${p.id}')">＋ Misión</button></div>
 <div class="mission-grid">${ms.map(m=>missionCard(m)).join('')||'<div class="empty">Todavía no hay misiones. Creá la primera, por ejemplo Canción o Video.</div>'}</div>
 ${oldTasks.length?`<div class="panel"><h3>Tareas sin misión</h3><p class="small">Estas tareas ya existían en el proyecto. Podés mantenerlas acá o asignarlas a una misión más adelante.</p>${oldTasks.map(t=>taskRow(t)).join('')}</div>`:''}
 <div class="actions"><button class="btn ghost" onclick="editProject('${p.id}')">Editar proyecto</button><button class="btn ghost" onclick="archiveProject('${p.id}')">Archivar</button><button class="btn danger" onclick="deleteProject('${p.id}')">Eliminar</button></div>
 <div class="panel"><h2>Actividad reciente</h2>${data.sessions.filter(s=>s.projectId===p.id).slice().reverse().slice(0,5).map(s=>`<div class="item"><b>${fmt(s.at)}</b><p>${safe(s.done||s.where||'Sesión registrada')}</p><p class="small">${s.missionId&&mission(s.missionId)?safe(mission(s.missionId).name)+' · ':''}Siguiente: ${safe(s.next||'—')}</p></div>`).join('')||'<p class="muted">Todavía no hay sesiones.</p>'}</div>`;
}
function missionCard(m){
 const ts=missionTasks(m.id),done=ts.filter(t=>t.done).length;
 return `<div class="mission-card" onclick="openMission('${m.id}')"><div class="headline"><div class="mission-icon">${m.icon||'✦'}</div><button class="edit-icon" onclick="event.stopPropagation();editMission('${m.id}')" aria-label="Editar misión">✎</button></div><div class="row between"><h3>${safe(m.name)}</h3><span class="tag">${done}/${ts.length}</span></div><p class="small">${safe(m.description||'Misión del proyecto')}</p><div class="progress"><i style="width:${ts.length?done/ts.length*100:0}%"></i></div><div class="small">${ts.length} tareas · Abrir misión →</div></div>`;
}
function openMission(mid){
 const m=mission(mid);if(!m)return;currentMission=mid;const p=project(m.projectId);tab='mission';touchCore(p.core,p.id,mid);
 const ts=missionTasks(mid);
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="openProject('${p.id}')">← ${safe(p.name)}</button><p class="eyebrow">${cname(p.core)} / ${safe(p.name)}</p><div class="mission-hero"><div class="mission-icon large">${m.icon||'✦'}</div><p class="eyebrow">MISIÓN</p><div class="headline"><h1>${safe(m.name)}</h1><button class="edit-icon" onclick="editMission('${m.id}')">✎</button></div><p class="muted">${safe(m.description||'')}</p></div>
 <div class="row between section-head"><div><h2>Tareas</h2><p class="small">${ts.filter(t=>!t.done).length} pendientes · ${ts.filter(t=>t.done).length} completadas</p></div><button class="btn" onclick="newTask('${p.id}','${m.id}')">＋ Tarea</button></div>
 <div class="task-list">${ts.map(t=>taskRow(t)).join('')||'<div class="empty">Todavía no hay tareas. Agregá la primera acción concreta.</div>'}</div>
 <div class="actions"><button class="btn" onclick="startSession('${p.id}','${m.id}')">＋ Registrar sesión en esta misión</button><button class="btn ghost" onclick="editMission('${m.id}')">Editar misión</button><button class="btn danger" onclick="deleteMission('${m.id}')">Eliminar misión</button></div>
 <div class="panel"><h2>Sesiones de esta misión</h2>${data.sessions.filter(s=>s.missionId===mid).slice().reverse().map(s=>`<div class="item"><b>${fmt(s.at)}</b><p>${safe(s.done||s.where||'Sesión registrada')}</p><p class="small">Próximo paso: ${safe(s.next||'—')}</p></div>`).join('')||'<p class="muted">Todavía no hay sesiones registradas.</p>'}</div>`;
}
function taskRow(t){const subs=Array.isArray(t.subtasks)?t.subtasks:[];return `<div class="task-row"><div class="task-main"><label><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="${t.done?'completed':''}">${safe(t.title)}</span></label>${subs.length?`<div class="subtask-list">${subs.map((s,i)=>`<div class="subtask"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${t.id}',${i})"><span class="${s.done?'completed':''}">${safe(s.title)}</span></div>`).join('')}</div>`:''}<div class="small">${t.priority||'Media'}</div></div><div class="task-actions"><button class="edit-icon" onclick="editTask('${t.id}')" aria-label="Editar tarea">✎</button></div></div>`}
function historyPage(){const sessions=data.sessions.slice().reverse();const archived=data.projects.filter(p=>p.archived);return `<p class="small">MEMORIA DE TRABAJO</p><h1>Historial</h1><div class="panel"><h2>Sesiones registradas</h2>${sessions.length?sessions.map(s=>`<div class="item"><b>${safe(project(s.projectId)?.name||'Proyecto archivado')}</b><p>${safe(s.done)}</p><div class="small">${cname(s.core)} · ${fmt(s.at)}</div></div>`).join(''):'<div class="empty">Todavía no hay sesiones guardadas.</div>'}</div><div class="panel"><h2>Proyectos archivados</h2>${archived.length?archived.map(p=>`<div class="item row between"><div><b>${safe(p.name)}</b><div class="small">${cname(p.core)}</div></div><div class="row"><button class="btn secondary" onclick="restoreProject('${p.id}')">Restaurar</button><button class="btn danger" onclick="deleteProject('${p.id}')">Eliminar</button></div></div>`).join(''):'<p class="muted">No hay proyectos archivados.</p>'}</div><div class="panel"><h2>Copia de seguridad</h2><p class="small">Tus datos se guardan en este navegador. Exportá una copia periódicamente para no perderlos.</p><button class="btn secondary" onclick="exportData()">Descargar copia JSON</button><label>Restaurar copia</label><input type="file" accept="application/json" onchange="importData(event)"></div>`}
function modal(content){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newProject(core=currentCore||'tomas'){modal(`<h2>Nuevo proyecto</h2><label>Núcleo</label><select id="pCore">${activeCores().map(c=>`<option value="${c[0]}" ${c[0]===core?'selected':''}>${safe(coreName(c[0]))}</option>`).join('')}</select><label>Nombre</label><input id="pName" placeholder="Ej. Videoclip nuevo"><label>Descripción</label><textarea id="pDesc" placeholder="¿De qué se trata?"></textarea><div class="actions"><button class="btn" onclick="saveProject()">Crear proyecto</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProject(){const name=document.getElementById('pName').value.trim();if(!name)return alert('Escribí un nombre.');const p={id:uid(),core:document.getElementById('pCore').value,name,description:document.getElementById('pDesc').value.trim(),created:Date.now(),archived:false,last:'',next:'',lastAt:null};data.projects.push(p);save();closeModal();currentCore=p.core;renderCore()}
function editProject(pid){const p=project(pid);modal(`<h2>Editar proyecto</h2><label>Nombre</label><input id="eName" value="${safe(p.name)}"><label>Descripción</label><textarea id="eDesc">${safe(p.description)}</textarea><div class="actions"><button class="btn" onclick="updateProject('${pid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProject(pid){const p=project(pid);p.name=document.getElementById('eName').value.trim()||p.name;p.description=document.getElementById('eDesc').value;save();closeModal();openProject(pid)}
function newMission(pid){modal(`<h2>Nueva misión</h2><label>Nombre</label><input id="mName" placeholder="Ej. Canción, Video, Lanzamiento"><label>Descripción</label><textarea id="mDesc" placeholder="¿Qué abarca esta misión?"></textarea><label>Ícono</label><select id="mIcon"><option>✦</option><option>♫</option><option>▣</option><option>✎</option><option>◎</option><option>◇</option></select><div class="actions"><button class="btn" onclick="saveMission('${pid}')">Crear misión</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveMission(pid){const name=document.getElementById('mName').value.trim();if(!name)return alert('Escribí un nombre.');const m={id:uid(),projectId:pid,name,description:document.getElementById('mDesc').value.trim(),icon:document.getElementById('mIcon').value,created:Date.now()};data.missions.push(m);save();closeModal();openProject(pid)}
function editMission(mid){const m=mission(mid);modal(`<h2>Editar misión</h2><label>Nombre</label><input id="emName" value="${safe(m.name)}"><label>Descripción</label><textarea id="emDesc">${safe(m.description||'')}</textarea><div class="actions"><button class="btn" onclick="updateMission('${mid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateMission(mid){const m=mission(mid);m.name=document.getElementById('emName').value.trim()||m.name;m.description=document.getElementById('emDesc').value;save();closeModal();openMission(mid)}
function newTask(pid,mid=''){modal(`<h2>Nueva tarea</h2><label>Tarea</label><input id="tTitle" placeholder="¿Qué hay que hacer?"><label>Prioridad</label><select id="tPriority"><option>Media</option><option>Alta</option><option>Baja</option></select><label>Subtareas (una por línea, opcional)</label><textarea id="tSubs" placeholder="Primer paso&#10;Segundo paso&#10;Tercer paso"></textarea><div class="actions"><button class="btn" onclick="saveTask('${pid}','${mid}')">Guardar tarea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTask(pid,mid=''){const title=document.getElementById('tTitle').value.trim();if(!title)return alert('Escribí una tarea.');const subtasks=document.getElementById('tSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:false}));data.tasks.push({id:uid(),projectId:pid,missionId:mid||null,title,priority:document.getElementById('tPriority').value,subtasks,done:false,created:Date.now()});save();closeModal();mid?openMission(mid):openProject(pid)}

function editCore(k){modal(`<h2>Editar núcleo</h2><label>Nombre</label><input id="cName" value="${safe(coreName(k))}"><label>Descripción</label><input id="cDesc" value="${safe(coreDesc(k))}"><div class="actions"><button class="btn" onclick="saveCore('${k}')">Guardar cambios</button><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`)}
function saveCore(k){if(!data.coreNames)data.coreNames={};if(!data.coreDescs)data.coreDescs={};data.coreNames[k]=document.getElementById('cName').value.trim()||coreName(k);data.coreDescs[k]=document.getElementById('cDesc').value.trim();save();closeModal();if(tab==='core')renderCore();else render()}
function editTask(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;modal(`<h2>Editar tarea</h2><label>Nombre</label><input id="etTitle" value="${safe(t.title)}"><label>Prioridad</label><select id="etPriority"><option ${t.priority==='Baja'?'selected':''}>Baja</option><option ${t.priority==='Media'?'selected':''}>Media</option><option ${t.priority==='Alta'?'selected':''}>Alta</option></select><label>Subtareas (una por línea)</label><textarea id="etSubs">${(t.subtasks||[]).map(s=>safe(s.title)).join('\n')}</textarea><div class="actions"><button class="btn" onclick="saveTaskEdit('${tid}')">Guardar cambios</button><button class="btn danger" onclick="deleteTask('${tid}')">Eliminar tarea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveTaskEdit(tid){const t=data.tasks.find(x=>x.id===tid);if(!t)return;t.title=document.getElementById('etTitle').value.trim()||t.title;t.priority=document.getElementById('etPriority').value;const previous=t.subtasks||[];t.subtasks=document.getElementById('etSubs').value.split('\n').map(x=>x.trim()).filter(Boolean).map(title=>({title,done:previous.find(s=>s.title===title)?.done||false}));if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function deleteTask(tid){if(!confirm('¿Eliminar esta tarea y sus subtareas?'))return;const t=data.tasks.find(x=>x.id===tid);data.tasks=data.tasks.filter(x=>x.id!==tid);if(!save())return;closeModal();if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}
function toggleSubtask(tid,index){const t=data.tasks.find(x=>x.id===tid);if(!t||!t.subtasks||!t.subtasks[index])return;t.subtasks[index].done=!t.subtasks[index].done;if(!save())return;if(t.missionId)openMission(t.missionId);else openProject(t.projectId)}

function toggleTask(tid){const t=data.tasks.find(x=>x.id===tid);if(t){t.done=!t.done;save();if(currentMission)openMission(currentMission);else if(currentProject)openProject(currentProject);else render()}}
function startSession(pid,mid=''){
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 modal(`<p class="eyebrow">${cname(p.core)} / ${safe(p.name)}${m?' / '+safe(m.name):''}</p><h2>Registrar sesión</h2><p class="muted">Anotá el avance. El borrador se guarda automáticamente; podés volver después.</p><label>¿Qué hiciste?</label><textarea id="sDone" placeholder="Avances realizados..."></textarea><label>¿Cuál es el próximo paso?</label><textarea id="sNext" placeholder="La acción concreta para continuar..."></textarea><p class="small">● Guardado automático activado</p><div class="actions"><button class="btn" onclick="saveSession('${pid}','${mid}')">Guardar sesión</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields(key,['sDone','sNext']);
}
function saveSession(pid,mid=''){
 const done=document.getElementById('sDone').value.trim(),next=document.getElementById('sNext').value.trim();
 if(!done&&!next)return alert('Registrá al menos un dato.');
 const p=project(pid),m=mid?mission(mid):null,key='session-'+pid+(mid?'-'+mid:'');
 data.sessions.push({id:uid(),projectId:pid,missionId:mid||null,core:p.core,done,where:'',next,at:Date.now()});
 p.last=done;p.next=next;p.lastAt=Date.now();
 if(!save())return;
 clearDraft(key);closeModal();mid?openMission(mid):openProject(pid);
}
function archiveProject(pid){if(!confirm('¿Archivar este proyecto? Podrás restaurarlo desde Historial.'))return;const p=project(pid);p.archived=true;if(data.lastMovement?.projectId===pid){const fallback=data.projects.filter(x=>!x.archived&&x.lastAt).sort((a,b)=>b.lastAt-a.lastAt)[0];data.lastMovement=fallback?{core:fallback.core,projectId:fallback.id,at:fallback.lastAt}:null}save();showCore(p.core)}
function restoreProject(pid){project(pid).archived=false;save();render()}
function deleteProject(pid){const p=project(pid);if(!p||!confirm('¿Eliminar definitivamente este proyecto, sus misiones, tareas y sesiones?'))return;const mids=data.missions.filter(m=>m.projectId===pid).map(m=>m.id);data.projects=data.projects.filter(x=>x.id!==pid);data.missions=data.missions.filter(m=>m.projectId!==pid);data.tasks=data.tasks.filter(t=>t.projectId!==pid);data.sessions=data.sessions.filter(s=>s.projectId!==pid);if(data.lastMovement?.projectId===pid)data.lastMovement=null;save();closeModal();showCore(p.core)}
function deleteMission(mid){const m=mission(mid);if(!m||!confirm('¿Eliminar esta misión, sus tareas y sus sesiones?'))return;data.missions=data.missions.filter(x=>x.id!==mid);data.tasks=data.tasks.filter(t=>t.missionId!==mid);data.sessions=data.sessions.filter(s=>s.missionId!==mid);if(data.lastMovement?.missionId===mid)data.lastMovement={core:project(m.projectId)?.core,projectId:m.projectId,at:Date.now()};save();openProject(m.projectId)}
function deleteCore(k){const pids=data.projects.filter(p=>p.core===k).map(p=>p.id);if(!confirm('¿Eliminar definitivamente este núcleo y TODO su contenido: proyectos, misiones, tareas, ideas y sesiones? Esta acción no se puede deshacer.'))return;data.projects=data.projects.filter(p=>p.core!==k);data.missions=data.missions.filter(m=>!pids.includes(m.projectId));data.tasks=data.tasks.filter(t=>!pids.includes(t.projectId));data.sessions=data.sessions.filter(s=>s.core!==k&&!pids.includes(s.projectId));delete data.ideasByCore[k];data.deletedCores=[...new Set([...(data.deletedCores||[]),k])];if(data.lastMovement?.core===k)data.lastMovement=null;save();tab='cores';render()}
function openIdeas(k){currentCore=k;touchCore(k);const ideas=coreIdeas(k);document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${k}')">← ${safe(coreName(k))}</button><div class="row between section-head"><div><p class="eyebrow">${safe(coreName(k))}</p><h1>Ideas</h1></div><span class="idea-bulb">💡</span></div><button class="btn" onclick="newCoreIdea('${k}')">＋ Nueva idea</button><div class="panel">${ideas.length?ideas.slice().sort((a,b)=>b.at-a.at).map(i=>`<div class="idea-card"><b>${safe(i.title||'Idea')}</b><p>${safe(i.text)}</p><div class="small">${fmt(i.at)}</div><div class="idea-actions"><button class="edit-icon" onclick="editCoreIdea('${k}','${i.id}')" aria-label="Editar idea">✎</button><button class="edit-icon" onclick="deleteCoreIdea('${k}','${i.id}')" aria-label="Eliminar idea">×</button></div></div>`).join(''):'<div class="empty">Todavía no hay ideas en este núcleo.</div>'}</div>`}
function newCoreIdea(k){modal(`<h2>Nueva idea</h2><label>Título</label><input id="ideaTitle" placeholder="Nombre breve"><label>Idea</label><textarea id="ideaText" placeholder="Desarrollá la idea..."></textarea><div class="actions"><button class="btn" onclick="saveCoreIdea('${k}')">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveCoreIdea(k){const text=document.getElementById('ideaText').value.trim();if(!text)return alert('Escribí la idea.');if(!data.ideasByCore[k])data.ideasByCore[k]=[];data.ideasByCore[k].push({id:uid(),title:document.getElementById('ideaTitle').value.trim(),text,at:Date.now()});save();closeModal();openIdeas(k)}
function editCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;modal(`<h2>Editar idea</h2><label>Título</label><input id="ideaTitle" value="${safe(i.title||'')}"><label>Idea</label><textarea id="ideaText">${safe(i.text)}</textarea><div class="actions"><button class="btn" onclick="updateCoreIdea('${k}','${id}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateCoreIdea(k,id){const i=coreIdeas(k).find(x=>x.id===id);if(!i)return;i.title=document.getElementById('ideaTitle').value.trim();i.text=document.getElementById('ideaText').value.trim();save();closeModal();openIdeas(k)}
function deleteCoreIdea(k,id){if(!confirm('¿Eliminar esta idea?'))return;data.ideasByCore[k]=coreIdeas(k).filter(x=>x.id!==id);save();openIdeas(k)}
function quickCapture(){
 modal(`<h2>Captura rápida</h2><p class="muted">La idea se guarda como borrador mientras escribís.</p><label>Idea o pendiente</label><textarea id="noteText" placeholder="Escribí acá..."></textarea><label>Núcleo</label><select id="noteCore"><option value="">Sin clasificar</option>${activeCores().map(c=>`<option value="${c[0]}">${safe(coreName(c[0]))}</option>`).join('')}</select><div class="actions"><button class="btn" onclick="saveNote()">Guardar idea</button><button class="btn ghost" onclick="closeModal()">Volver después</button></div>`);
 bindDraftFields('quick-note',['noteText','noteCore']);
}
function saveNote(){const text=document.getElementById('noteText').value.trim();if(!text)return alert('Escribí una idea.');data.notes.push({id:uid(),text,core:document.getElementById('noteCore').value,at:Date.now()});if(!save())return;clearDraft('quick-note');closeModal();alert('Idea guardada.')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hoy-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.projects)||!Array.isArray(x.tasks))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){data={...x,projects:x.projects,tasks:x.tasks,sessions:x.sessions||[],missions:x.missions||[],notes:x.notes||[],ideasByCore:x.ideasByCore||{},deletedCores:x.deletedCores||[]};save();render();alert('Copia restaurada.')}}catch{alert('El archivo no parece una copia válida de HOY.')}};r.readAsText(f)}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
document.getElementById('add').onclick=quickCapture;document.getElementById('backup').onclick=exportData;
render();
window.addEventListener('pagehide',()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}});
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script>
</body></html>
