<div id="modal"></div>
<script>
const KEY='hoy-data-v1';
const APP_VERSION='V31';
// Interruptor técnico en este archivo: false oculta Calendario para todos los usuarios.
// No borra datos; al volver a true, el calendario reaparece.
const HOY_CONFIG={modules:{calendarEnabled:true}};
function calendarIsAvailable(){return HOY_CONFIG.modules.calendarEnabled;}
const APP_RELEASE_DATE='27/11/2026';
const cores=[['tomas','TOMÁS','Cuerpo · Mente · Alma','tom','◉'],['asoka','ASOKA','Música · Videoclips','aso','♫'],['ruby','RUBY','Grupo · Eventos · Contenido','rub','✳'],['godd','GODD','Ropa · Merchandising','god','◇']];
let data=read(),tab='today',currentCore=null,currentProject=null,currentMission=null;
if(!Array.isArray(data.missions))data.missions=[];if(!Array.isArray(data.missionFolders))data.missionFolders=[];if(!Array.isArray(data.projectMissionFolders))data.projectMissionFolders=[];if(!Array.isArray(data.sessions))data.sessions=[];if(!Array.isArray(data.tasks))data.tasks=[];if(!Array.isArray(data.projects))data.projects=[];if(!Array.isArray(data.notes))data.notes=[];if(!data.ideasByCore)data.ideasByCore={};if(!Array.isArray(data.deletedCores))data.deletedCores=[];if(!Array.isArray(data.notes))data.notes=[];if(!data.coreIcons)data.coreIcons={};if(!Array.isArray(data.customCores))data.customCores=[];if(!Array.isArray(data.coreOrder))data.coreOrder=[];if(!Array.isArray(data.completionEvents))data.completionEvents=[];data.customCores.forEach(id=>{if(!cores.some(c=>c[0]===id))cores.push([id,data.coreNames?.[id]||'NÚCLEO',data.coreDescs?.[id]||'','custom','']);});
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{projects:[],tasks:[],sessions:[],notes:[]}}catch{return {projects:[],tasks:[],sessions:[],notes:[]}}}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(data));setSaveStatus('Guardado','ok');return true}
 catch(e){setSaveStatus('Error al guardar','error');return false}
}
const DRAFT_KEY='hoy-drafts-v1';
function setSaveStatus(label,state='ok'){
 const el=document.getElementById('saveStatus');
 if(el){el.textContent='● '+label;el.className='small '+(state==='error'?'save-error':state==='pending'?'save-pending':'save-ok')}
}
function readDrafts(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY))||{}}catch(e){return {}}}
function writeDraft(key,value){
 setSaveStatus('Guardando…','pending');
 try{const drafts=readDrafts();drafts[key]={value,updatedAt:Date.now()};localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts));setSaveStatus('Borrador guardado','ok')}
 catch(e){setSaveStatus('Error al guardar','error')}
}
function getDraft(key){return readDrafts()[key]?.value||{}}
function clearDraft(key){const drafts=readDrafts();delete drafts[key];try{localStorage.setItem(DRAFT_KEY,JSON.stringify(drafts))}catch(e){}}
function bindDraftFields(key,ids){
 const draft=getDraft(key);
 ids.forEach(id=>{
  const el=document.getElementById(id);if(!el)return;
  if(draft[id]!==undefined)el.value=draft[id];
  el.addEventListener('input',()=>{
   const value={};ids.forEach(field=>{const node=document.getElementById(field);if(node)value[field]=node.value});
   writeDraft(key,value);
  });
 });
}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coreName(k){return data.coreNames?.[k]||cores.find(c=>c[0]===k)?.[1]||k}
function coreDesc(k){return data.coreDescs?.[k]||cores.find(c=>c[0]===k)?.[2]||''}
function cname(k){return coreName(k)}
function coreIcon(k){return ''}
function fmt(d){return new Date(d).toLocaleString('es-AR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function project(id){return data.projects.find(p=>p.id===id)}
function mission(id){return data.missions.find(m=>m.id===id)}
function missionTasks(id){return data.tasks.filter(t=>t.missionId===id)}
function activeCores(){const list=cores.filter(c=>!(data.deletedCores||[]).includes(c[0]));const order=Array.isArray(data.coreOrder)?data.coreOrder:[];return list.sort((a,b)=>{const ai=order.indexOf(a[0]),bi=order.indexOf(b[0]);return (ai<0?9999:ai)-(bi<0?9999:bi)})}
function moveCore(id,delta){const list=activeCores(),i=list.findIndex(c=>c[0]===id),j=i+delta;if(i<0||j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];data.coreOrder=list.map(c=>c[0]);if(!save())return;render()}
function touchCore(k,projectId=null,missionId=null){const now=Date.now();data.lastMovement={core:k,projectId,missionId,at:now};if(projectId){const p=project(projectId);if(p)p.lastAt=now}if(missionId){const m=mission(missionId);if(m)m.lastActivityAt=now}save()}
function coreIdeas(k){return Array.isArray(data.ideasByCore[k])?data.ideasByCore[k]:[]}
function render(){
 const calendarNav=document.getElementById('calendarNav');if(calendarNav)calendarNav.hidden=!calendarIsAvailable();if(!calendarIsAvailable()&&tab==='calendar')tab='today';
 document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const app=document.getElementById('app');
 if(tab==='today') app.innerHTML=today();
 if(tab==='calendar') app.innerHTML=calendarPage();
 if(tab==='cores') app.innerHTML=corePage();
 if(tab==='history') app.innerHTML=historyPage();
 if(tab==='ideas') app.innerHTML=ideasPage();
 if(tab==='advice') app.innerHTML=advicePage();
 refreshBrain();
}

function setTheme(on){document.body.classList.toggle('dark',!!on);localStorage.setItem('hoy-theme',on?'dark':'light');const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.content=on?'#14212a':'#eaf4f8'}
function initTheme(){setTheme(localStorage.getItem('hoy-theme')==='dark')}
function missionCompletion(){const ms=data.missions.filter(m=>!m.archived);if(!ms.length)return 0;const completed=ms.filter(m=>{const ts=missionTasks(m.id);return ts.length>0&&ts.every(t=>t.done)}).length;return Math.round(completed/ms.length*100)}
const adviceLibrary={bible:[],martin:[],sanmartin:[
 {text:'Humanizar el carácter y hacerlo sensible aun con los insectos que nos perjudican.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla amor a la verdad y odio a la mentira.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla gran confianza y amistad, pero uniendo el respeto.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Estimular en Mercedes la caridad con los pobres.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Respeto sobre la propiedad ajena.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Acostumbrarla a guardar un secreto.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla sentimientos de indulgencia hacia todas las religiones.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Dulzura con los criados, pobres y viejos.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Que hable poco y lo preciso.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Acostumbrarla a estar formal en la mesa.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Amor al aseo y desprecio al lujo.',ref:'Máximas de San Martín a Mercedes · 1825'},
 {text:'Inspirarla amor por la Patria y por la Libertad.',ref:'Máximas de San Martín a Mercedes · 1825'}
]};
function curatedBibleAdvice(items){
 const ranges=[['Proverbios',3,5,6],['Proverbios',16,1,3],['Proverbios',27,17,19],['Eclesiastés',3,1,8],['Mateo',5,3,10],['Mateo',6,25,34],['Mateo',7,24,27],['Lucas',6,27,31],['Romanos',12,9,18],['1 Corintios',13,4,7],['Filipenses',4,4,9],['Santiago',1,19,22],['Gálatas',6,7,10],['Salmos',23,1,6],['Salmos',37,3,7],['Miqueas',6,8,8]];
 return ranges.map(([book,ch,a,z])=>{const found=items.filter(v=>{const m=v.ref.match(/^(.*?) (\d+):(\d+)$/);return m&&m[1]===book&&Number(m[2])===ch&&Number(m[3])>=a&&Number(m[3])<=z});if(!found.length)return null;return {text:found.map(v=>v.text.replace(/^\d+\s*/, '')).join(' '),ref:`${book} ${ch}:${a}${z>a?'-'+z:''}`}}).filter(Boolean);
}
async function loadAdviceSources(){
 try{const [b,m]=await Promise.all([fetch('bible-consejos.json').then(r=>r.json()),fetch('martin-fierro.json').then(r=>r.json())]);
 adviceLibrary.bible=b.items;
 adviceLibrary.martin=m.items.filter(v=>v.text&&v.text.trim().split('\n').length>=3).map(v=>({text:v.text,ref:v.reference}));
 }catch(e){console.error('No se pudieron cargar las fuentes de Consejos',e)}
}
function chooseAdviceOnLaunch(){const seen=data.adviceSeen||{};data.adviceCurrent={};Object.keys(adviceLibrary).forEach(k=>{if(!adviceLibrary[k].length)return;let ids=seen[k]||[];if(ids.length>=adviceLibrary[k].length)ids=[];const pool=adviceLibrary[k].map((_,i)=>i).filter(i=>!ids.includes(i));const pick=pool[Math.floor(Math.random()*pool.length)];data.adviceCurrent[k]=pick;ids.push(pick);seen[k]=ids;});data.adviceSeen=seen;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function advicePage(){const order=['bible','martin','sanmartin'];return `<p class="eyebrow">CONSEJOS</p><h1>Consejos</h1><div class="advice-stack">${order.map(k=>{const v=adviceLibrary[k][data.adviceCurrent?.[k]??0]||{text:'No se pudo cargar este contenido.',ref:'Fuente no disponible'};return `<article class="advice-panel panel"><blockquote>“${safe(v.text)}”</blockquote><div class="small">${safe(v.ref)}</div></article>`}).join('')}</div>`}

function showAllPriorities(){const list=[...data.tasks.filter(t=>!t.done&&t.priority==='Alta').map(t=>({kind:'task',item:t})),...data.missions.filter(m=>!(m.completedAt||m.done)&&m.priority==='Alta').map(m=>({kind:'mission',item:m}))].sort((a,b)=>(a.item.created||0)-(b.item.created||0));modal(`<h2>Todas las urgencias</h2>${list.map(({kind,item})=>{const p=project(item.projectId),m=kind==='mission'?item:(item.missionId?mission(item.missionId):null);return `<div class="item"><button class="text-button" onclick="closeModal();${m?`openMission('${m.id}')`:`openProject('${item.projectId}')`}">${safe(kind==='mission'?item.name:item.title)}</button><div class="small">${p?cname(p.core)+' · '+safe(p.name):'Proyecto'}${m&&kind==='task'?' · '+safe(m.name):''} · ${kind==='mission'?'Misión':'Tarea de la misión'}</div></div>`}).join('')||'<p class="muted">No hay urgencias pendientes.</p>'}<div class="actions"><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`) }
// CALENDARIO HOY V24 — los elementos se guardan dentro de hoy-data-v1 sin alterar proyectos ni misiones.
if(!Array.isArray(data.calendarItems))data.calendarItems=[];
let calDate=new Date(),calView='month';
const calTypes={event:['Evento','▣'],activity:['Actividad','◉'],note:['Anotación','✎']};
function calISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function calParse(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)}
function calEsc(v){return safe(v||'')}
function calItemsForDay(day){return data.calendarItems.filter(x=>calOccurs(x,day)).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function calOccurs(x,day){const start=calParse(x.date), target=calParse(day);if(target<start)return false;const diff=Math.round((target-start)/86400000), rule=x.repeat||'none';if(rule==='none')return diff===0;if(x.until&&day>x.until)return false;if(rule==='daily')return true;if(rule==='weekly')return diff%7===0&&(x.days?.length?x.days.includes(target.getDay()):true);if(rule==='monthly')return start.getDate()===target.getDate();if(rule==='custom')return (x.interval||1)>0&&diff%(x.interval||1)===0;return false}
function calMonthLabel(d){return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'})}
function calendarPage(){if(!calendarIsAvailable())return '';const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells='';for(let i=0;i<offset;i++)cells+='<span class="cal-empty"></span>';for(let n=1;n<=days;n++){const d=new Date(y,m,n,12),iso=calISO(d),items=calItemsForDay(iso),today=iso===calISO(new Date());cells+=`<button class="cal-day ${today?'is-today':''} ${iso===calISO(calDate)?'is-selected':''}" onclick="calSelect('${iso}')"><span>${n}</span><i>${items.slice(0,3).map(x=>`<b class="${x.core||'neutral'} ${x.kind}"></b>`).join('')}</i></button>`}
const chosen=calISO(calDate),items=calItemsForDay(chosen),missions=data.missions.filter(x=>!x.archived&&!x.done&&!x.completedAt&&!x.calendarDate&&!data.calendarItems.some(ci=>ci.kind==='mission'&&ci.missionId===x.id));
const list=items.length?items.map(x=>calItemRow(x,chosen)).join(''):'<p class="small muted">No hay elementos para este día.</p>';
let body=calView==='month'?`<div class="cal-weekdays">${['L','M','X','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cal-grid">${cells}</div>`:calView==='week'?calWeekView():`<div class="cal-day-focus"><strong>${calDate.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</strong><p class="small">${items.length} elemento(s)</p></div>`;
const unscheduled=activeCores().map(c=>{const key=c[0],coreProjects=data.projects.filter(p=>!p.archived&&p.core===key),groups=coreProjects.map(p=>{const ms=missions.filter(x=>x.projectId===p.id);if(!ms.length)return '';return `<details class="cal-project-group"><summary>${calEsc(p.name)} · ${ms.length}</summary>${ms.map(x=>`<div class="cal-unscheduled"><span>${calEsc(x.name||x.title||'Misión')}</span><button class="text-button" onclick="calLinkMission('${x.id}')">＋ Fecha</button></div>`).join('')}</details>`}).join('');const count=coreProjects.reduce((n,p)=>n+missions.filter(x=>x.projectId===p.id).length,0);return count?`<details class="cal-core-group"><summary><span class="cal-dot ${key}"></span>${calEsc(coreName(key))}<span class="small muted">${count}</span></summary>${groups}</details>`:''}).join('');
return `<div class="cal-head"><div><p class="small">ORGANIZACIÓN</p><h1>Calendario</h1></div><div class="cal-head-actions"><button class="btn" onclick="newCalendarItem()">＋ Nuevo</button></div></div><section class="panel cal-panel"><div class="cal-toolbar"><button class="cal-arrow" onclick="calMove(-1)">‹</button><strong>${calMonthLabel(calDate)}</strong><button class="cal-arrow" onclick="calMove(1)">›</button></div><div class="cal-views">${['month','week','day'].map((v,i)=>`<button class="${calView===v?'active':''}" onclick="calView='${v}';render()">${['Mes','Semana','Día'][i]}</button>`).join('')}</div>${body}<div class="cal-selected-date"><span>${calDate.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</span><button class="text-button" onclick="calDate=new Date();render()">Hoy</button></div>${list}</section><section class="panel"><div class="row between"><h3>Sin programar</h3><span class="small">${missions.length} misiones</span></div><p class="small muted">Abrí un núcleo y después un proyecto para elegir qué misiones agendar.</p>${unscheduled||'<p class="small muted">No hay misiones pendientes sin programar.</p>'}</section><p class="small muted cal-legend">● Misión · ▣ Evento · ◉ Actividad · ✎ Anotación</p>`}
function calWeekView(){const start=new Date(calDate);start.setDate(start.getDate()-((start.getDay()+6)%7));return `<div class="cal-week-list">${Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=calISO(d),it=calItemsForDay(iso);return `<button class="cal-week-row ${iso===calISO(calDate)?'is-selected':''}" onclick="calSelect('${iso}')"><b>${d.toLocaleDateString('es-AR',{weekday:'short',day:'numeric'})}</b><span>${it.length?it.map(x=>calEsc(x.title)).join(' · '):'—'}</span></button>`}).join('')}</div>`}
function calMove(n){if(calView==='day')calDate.setDate(calDate.getDate()+n);else if(calView==='week')calDate.setDate(calDate.getDate()+7*n);else calDate.setMonth(calDate.getMonth()+n);render()}
function calSelect(v){calDate=calParse(v);render()}
function calItemRow(x,day){const linked=x.kind==='mission',label=linked?(mission(x.missionId)?.name||'Misión vinculada'):x.title;return `<div class="cal-item"><span class="cal-dot ${x.core||'neutral'} ${x.kind}"></span><div class="cal-item-main"><b>${calEsc(label)}</b><span>${linked?'Misión':calTypes[x.kind]?.[0]||'Elemento'}${x.time?' · '+x.time:''}${x.repeat&&x.repeat!=='none'?' · Repite':''}</span></div><div class="cal-item-actions"><button class="text-button" onclick="calToggleDone('${x.id}','${day}')">${x.doneDates?.includes(day)?'Hecho ✓':'Marcar'}</button><button onclick="calItemOptions('${x.id}')" aria-label="Opciones del elemento">⋯</button></div></div>`}
function newCalendarItem(){modal(`<h2>Nuevo elemento</h2><div class="cal-type-choices"><button class="btn secondary" onclick="calNewForm('mission')">◎ Vincular misión existente</button><button class="btn secondary" onclick="calNewMissionForm()">＋ Crear misión</button><button class="btn secondary" onclick="calNewForm('event')">▣ Evento</button><button class="btn secondary" onclick="calNewForm('activity')">◉ Actividad</button><button class="btn secondary" onclick="calNewForm('note')">✎ Anotación</button></div>`)}
function calBaseFields(core='neutral'){return `<label>Fecha</label><input id="calDate" type="date" value="${calISO(calDate)}"><label>Hora (opcional)</label><input id="calTime" type="time"><label>Repetir</label><select id="calRepeat" onchange="document.getElementById('calRepeatExtra').hidden=this.value==='none'"><option value="none">No repetir</option><option value="daily">Todos los días</option><option value="weekly">Todas las semanas</option><option value="monthly">Todos los meses</option><option value="custom">Personalizada</option></select><div id="calRepeatExtra" hidden><label>Repetir cada (días)</label><input id="calInterval" type="number" min="1" value="2"><label>Hasta (opcional)</label><input id="calUntil" type="date"></div><label class="cal-check"><input id="calReminder" type="checkbox" checked> Recordatorio activado</label>`}
function calNewForm(kind){const isMission=kind==='mission',available=data.missions.filter(m=>!m.archived&&!m.done&&!m.completedAt);modal(`<h2>${isMission?'Vincular misión existente':'Nuevo '+calTypes[kind][0].toLowerCase()}</h2>${isMission?`<label>Misión existente</label><select id="calMission">${available.map(m=>`<option value="${m.id}">${calEsc(m.name||m.title)} · ${calEsc(coreName(project(m.projectId)?.core||'neutral'))}</option>`).join('')}</select><p class="small muted">Se conserva el núcleo y proyecto que ya tiene asignados. No se modifican.</p>`:`<label>Nombre</label><input id="calTitle" placeholder="¿Qué querés agendar?" maxlength="100"><label>Núcleo (opcional)</label><select id="calCore"><option value="neutral">Sin núcleo</option>${activeCores().map(c=>`<option value="${c[0]}">${calEsc(coreName(c[0]))}</option>`).join('')}</select>`}${calBaseFields()}<div class="actions"><button class="btn" onclick="calSave('${kind}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function calNewMissionForm(){const cs=activeCores();modal(`<h2>Crear misión y agendar</h2><label>Núcleo</label><select id="calNewCore" onchange="calFillProjects()">${cs.map(c=>`<option value="${c[0]}">${calEsc(coreName(c[0]))}</option>`).join('')}</select><label>Proyecto</label><select id="calNewProject">${data.projects.filter(p=>!p.archived&&p.core===cs[0]?.[0]).map(p=>`<option value="${p.id}">${calEsc(p.name)}</option>`).join('')}</select><label>Nombre de la misión</label><input id="calNewMissionName" maxlength="100" placeholder="¿Qué misión querés crear?"><label>Descripción (opcional)</label><textarea id="calNewMissionDesc"></textarea>${calBaseFields()}<div class="actions"><button class="btn" onclick="calSaveNewMission()">Crear y agendar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function calFillProjects(){const core=document.getElementById('calNewCore').value,sel=document.getElementById('calNewProject');sel.innerHTML=data.projects.filter(p=>!p.archived&&p.core===core).map(p=>`<option value="${p.id}">${calEsc(p.name)}</option>`).join('')}
function calReadSchedule(){return {date:document.getElementById('calDate').value,time:document.getElementById('calTime').value,repeat:document.getElementById('calRepeat').value,interval:Number(document.getElementById('calInterval')?.value||1),until:document.getElementById('calUntil')?.value||null,reminder:document.getElementById('calReminder').checked}}
function calSaveNewMission(){const pid=document.getElementById('calNewProject').value,name=document.getElementById('calNewMissionName').value.trim(),v=calReadSchedule();if(!pid)return alert('Elegí un proyecto para esta misión.');if(!name)return alert('Escribí el nombre de la misión.');if(!v.date)return alert('Elegí una fecha.');const m={id:uid(),projectId:pid,name,description:document.getElementById('calNewMissionDesc').value.trim(),priority:'Media',order:data.missions.filter(x=>x.projectId===pid&&!(x.completedAt||x.done)).length,created:Date.now()};data.missions.push(m);data.calendarItems.push({id:uid(),kind:'mission',title:name,missionId:m.id,date:v.date,time:v.time,core:project(pid)?.core||'neutral',repeat:v.repeat,interval:v.interval,until:v.until,reminder:v.reminder,doneDates:[],created:Date.now()});save();closeModal();calDate=calParse(v.date);tab='calendar';render()}
function calSave(kind){const v=calReadSchedule();if(!v.date)return alert('Elegí una fecha.');const linked=kind==='mission',m=linked?mission(document.getElementById('calMission').value):null,title=linked?(m?.name||m?.title||'Misión'):(document.getElementById('calTitle').value.trim());if(!linked&&!title)return alert('Escribí un nombre.');if(linked&&data.calendarItems.some(x=>x.kind==='mission'&&x.missionId===m.id))return alert('Esta misión ya está agendada.');const core=linked?(project(m?.projectId)?.core||'neutral'):document.getElementById('calCore').value;data.calendarItems.push({id:uid(),kind,title,missionId:m?.id||null,date:v.date,time:v.time,core,repeat:v.repeat,interval:v.interval,until:v.until,reminder:v.reminder,doneDates:[],created:Date.now()});save();closeModal();calDate=calParse(v.date);tab='calendar';render()}
function calLinkMission(id){const m=mission(id);if(!m)return;calNewForm('mission');const sel=document.getElementById('calMission');if(sel)sel.value=id}
function calScheduleMission(id){const m=mission(id);if(!m)return;calNewForm('mission');const sel=document.getElementById('calMission');if(sel)sel.value=id}
function calItemOptions(id){const x=data.calendarItems.find(i=>i.id===id);if(!x)return;const linked=x.kind==='mission';modal(`<h2>Elemento del calendario</h2><p>${calEsc(linked?(mission(x.missionId)?.name||'Misión vinculada'):x.title)}</p><p class="small muted">${linked?'Quitarla del calendario no elimina ni modifica la misión.':'Eliminarlo solo afecta al calendario.'}</p><div class="actions"><button class="btn danger" onclick="calDeleteItem('${id}')">${linked?'Quitar del calendario':'Eliminar elemento'}</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function calDeleteItem(id){const x=data.calendarItems.find(i=>i.id===id);if(!x)return;const linked=x.kind==='mission';if(!confirm(linked?'¿Quitar esta misión del calendario? La misión seguirá existiendo en su proyecto.':'¿Eliminar este elemento del calendario?'))return;data.calendarItems=data.calendarItems.filter(i=>i.id!==id);save();closeModal();render()}
function calToggleDone(id,day){const x=data.calendarItems.find(i=>i.id===id);if(!x)return;if(!x.doneDates)x.doneDates=[];if(x.kind==='mission'){const choice=confirm('¿También querés completar la misión en HOY?\n\nAceptar: completar en HOY.\nCancelar: marcar solamente en el calendario.');if(choice){const m=mission(x.missionId);if(m){m.done=true;m.completedAt=Date.now()}}}if(x.doneDates.includes(day))x.doneDates=x.doneDates.filter(d=>d!==day);else x.doneDates.push(day);save();render()}

function today(){
 const active=data.projects.filter(p=>!p.archived);
 const priorities=[...data.tasks.filter(t=>!t.done&&t.priority==='Alta').map(t=>({kind:'task',item:t})),...data.missions.filter(m=>!(m.completedAt||m.done)&&m.priority==='Alta').map(m=>({kind:'mission',item:m}))].sort((a,b)=>(a.item.created||0)-(b.item.created||0));
 const visiblePriorities=priorities.slice(0,3);
 const recentTasks=visiblePriorities.map(({kind,item})=>{const p=project(item.projectId),m=kind==='mission'?item:(item.missionId?mission(item.missionId):null),title=kind==='mission'?item.name:item.title;return `<div class="item"><button class="text-button" onclick="${m?`openMission('${m.id}')`:`openProject('${item.projectId}')`}">${safe(title)}</button><div class="small">${p?cname(p.core)+' · '+safe(p.name):'Proyecto'}${m&&kind==='task'?' · '+safe(m.name):''} · ${kind==='mission'?'Misión':'Tarea de la misión'}</div></div>`}).join('');
 const pendingTasks=data.tasks.filter(t=>!t.done).length;
 const pendingMissions=data.missions.filter(m=>!m.completedAt&&!m.done).length;
 return `<p class="small">CENTRO DE CONTROL</p><h1 class="dashboard-title">El mundo es de quien lo hace suyo</h1>
 
 <div class="panel" id="priorityPanel"><div class="row between"><h2>Prioridades</h2><span class="small">${visiblePriorities.length}/3</span></div>${priorities.length?recentTasks:'<p class="muted">No hay prioridades altas pendientes.</p>'}${priorities.length>3?`<button class="priority-more" onclick="showAllPriorities()">•••</button>`:''}</div>
 <div class="row between"><h2>Tus núcleos</h2><button class="btn ghost" onclick="tab='cores';render()">Ver todos</button></div><div class="core-stack">${activeCores().map((c,i)=>coreTile(c,i)).join('')}</div>
 <div class="activity-inline"><span><b>${active.length}</b> proyectos</span><span><b>${pendingTasks}</b> tareas de la misión pendientes</span><span><b>${pendingMissions}</b> misiones pendientes</span></div><div class="theme-control"><span>Modo oscuro</span><label class="switch"><input type="checkbox" id="themeSwitch" ${localStorage.getItem('hoy-theme')==='dark'?'checked':''} onchange="setTheme(this.checked)"><span></span></label></div>`;
}
function coreTile(c,index=0){const color=data.coreColors?.[c[0]]||defaultCoreColor(c[0]),list=activeCores();return `<div class="core-tile" style="--core-color:${color}" role="button" tabindex="0" onclick="showCore('${c[0]}')" onkeydown="if(event.key==='Enter'){showCore('${c[0]}')}"><div class="core-tile-copy"><strong>${safe(coreName(c[0]))}</strong><span class="core-description">${safe(coreDesc(c[0]))}</span></div><div class="core-tile-actions"><button onclick="event.stopPropagation();moveCore('${c[0]}',-1)" ${index===0?'disabled':''} aria-label="Subir núcleo">↑</button><button onclick="event.stopPropagation();moveCore('${c[0]}',1)" ${index===list.length-1?'disabled':''} aria-label="Bajar núcleo">↓</button><button onclick="event.stopPropagation();editCore('${c[0]}')" aria-label="Editar núcleo">✎</button></div></div>`}
function defaultCoreColor(k){return ({tomas:'#91b9c7',asoka:'#86a9c7',ruby:'#c89ca7',godd:'#c9a66d'})[k]||'#c99b4b'}
function hexWithAlpha(hex,alpha){const h=String(hex||'#c99b4b').replace('#','');if(!/^[0-9a-f]{6}$/i.test(h))return '#c99b4b20';return `#${h}${alpha}`}

function corePage(){return `<div class="row between"><div><p class="small">ESPACIOS DE TRABAJO</p><h1>Núcleos</h1></div><button class="btn" onclick="newCore()">＋ Núcleo</button></div><p class="muted">Cada núcleo mantiene sus proyectos e historial.</p><div class="core-stack">${activeCores().map((c,i)=>coreTile(c,i)).join('')}</div>`}
function newCore(){modal(`<h2>Nuevo núcleo</h2><label>Nombre</label><input id="newCoreName" placeholder="Nombre del núcleo"><label>Descripción</label><input id="newCoreDesc" placeholder="Área de trabajo"><label>Color del bloque</label><input id="newCoreColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveNewCore()">Crear núcleo</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveNewCore(){const name=document.getElementById('newCoreName').value.trim();if(!name)return alert('Escribí un nombre.');const id='custom-'+uid();cores.push([id,name,document.getElementById('newCoreDesc').value.trim(),'custom','◇']);if(!data.customCores)data.customCores=[];data.customCores.push(id);if(!data.coreNames)data.coreNames={};if(!data.coreDescs)data.coreDescs={};if(!data.coreIcons)data.coreIcons={};if(!data.coreColors)data.coreColors={};data.coreNames[id]=name;data.coreDescs[id]=document.getElementById('newCoreDesc').value.trim();data.coreIcons[id]='';data.coreColors[id]=document.getElementById('newCoreColor').value;save();closeModal();tab='cores';render()}

function showCore(k){currentCore=k;tab='core';touchCore(k);renderCore()}
function renderCore(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',false));document.getElementById('app').innerHTML=coreDetail(currentCore)}
function coreDetail(k){const c=cores.find(x=>x[0]===k);const ps=data.projects.filter(p=>p.core===k&&!p.archived);return `<button class="btn ghost" onclick="tab='cores';render()">← Núcleos</button><div class="headline"><div><p class="small">${safe(coreName(c[0]))}</p><h1>${safe(coreDesc(c[0]))}</h1></div><button class="edit-icon" onclick="editCore('${k}')" aria-label="Editar núcleo">✎</button></div><div class="row between"><h2>Proyectos</h2><button class="btn" onclick="newProject('${k}')">+ Proyecto</button></div>${ps.length?ps.map(p=>projectCard(p)).join(''):'<div class="empty">Todavía no hay proyectos en este núcleo.</div>'}<div class="actions"><button class="btn danger" onclick="deleteCore('${k}')">Eliminar núcleo</button></div>`}
function projectCard(p){
 const ms=data.missions.filter(m=>m.projectId===p.id&&!(m.completedAt||m.done)), oldTasks=data.tasks.filter(t=>t.projectId===p.id&&!t.missionId);
 const total=data.tasks.filter(t=>t.projectId===p.id).length,done=data.tasks.filter(t=>t.projectId===p.id&&t.done).length;
 return `<div class="project-card" onclick="openProject('${p.id}')"><div class="headline"><span class="eyebrow">${cname(p.core)} / PROYECTO</span><button class="edit-icon" onclick="event.stopPropagation();editProject('${p.id}')" aria-label="Editar proyecto">✎</button></div><div class="row between"><h3>${safe(p.name)}</h3><span class="tag">${p.completedAt?'TERMINADO':`${done}/${total}`}</span></div><p class="small">${safe(p.description||'Espacio de trabajo')}</p><div class="row between small"><span>${ms.length} misiones</span><span>${p.lastAt?'Actividad '+fmt(p.lastAt):'Sin actividad'}</span></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div></div>`;
}

function projectMissionFolders(pid){return (data.projectMissionFolders||[]).filter(f=>f.projectId===pid)}
function newProjectMissionFolder(pid){modal(`<h2>Nueva carpeta de misiones</h2><label>Nombre</label><input id="pmfName" placeholder="Ej. Producción, Pendientes"><label>Color</label><input id="pmfColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveProjectMissionFolder('${pid}')">Crear carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProjectMissionFolder(pid){const name=document.getElementById('pmfName').value.trim();if(!name)return alert('Escribí un nombre.');if(!Array.isArray(data.projectMissionFolders))data.projectMissionFolders=[];data.projectMissionFolders.push({id:uid(),projectId:pid,name,color:document.getElementById('pmfColor').value||'#c99b4b'});save();closeModal();openProject(pid)}
function editProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;modal(`<h2>Editar carpeta</h2><label>Nombre</label><input id="epmfName" value="${safe(f.name)}"><label>Color</label><input id="epmfColor" type="color" value="${safe(f.color||'#c99b4b')}"><div class="actions"><button class="btn" onclick="updateProjectMissionFolder('${fid}')">Guardar</button><button class="btn danger" onclick="deleteProjectMissionFolder('${fid}')">Eliminar carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;f.name=document.getElementById('epmfName').value.trim()||f.name;f.color=document.getElementById('epmfColor').value||f.color;save();closeModal();openProject(f.projectId)}
function deleteProjectMissionFolder(fid){const f=(data.projectMissionFolders||[]).find(x=>x.id===fid);if(!f)return;if(!confirm('¿Eliminar carpeta? Las misiones se conservarán sin carpeta.'))return;data.missions.forEach(m=>{if(m.folderId===fid)delete m.folderId});data.projectMissionFolders=data.projectMissionFolders.filter(x=>x.id!==fid);save();closeModal();openProject(f.projectId)}
function missionPriorityBadge(m){return `<span class="priority-badge priority-${String(m.priority||'Media').toLowerCase()}">${safe(m.priority||'Media')}</span>`}

let projectFolderFilter = {};
function setProjectFolderFilter(pid,folderId){projectFolderFilter[pid]=folderId;openProject(pid)}
function openProject(pid){
 currentProject=pid;const p=project(pid);if(!p)return;tab='project';touchCore(p.core,pid);
 const allMs=data.missions.filter(m=>m.projectId===pid).slice().sort((a,b)=>(a.order??0)-(b.order??0));const ms=allMs.filter(m=>!(m.completedAt||m.done));const doneMs=allMs.filter(m=>!!(m.completedAt||m.done));
 const oldTasks=data.tasks.filter(t=>t.projectId===pid&&!t.missionId),folders=projectMissionFolders(pid);
 const activeFolder=projectFolderFilter[pid]||'';
 const looseCount=ms.filter(m=>!m.folderId).length;
 const visibleMs=activeFolder==='__none__'?ms.filter(m=>!m.folderId):(activeFolder?ms.filter(m=>m.folderId===activeFolder):ms);
 const folderShortcuts=`<div class="folder-shortcuts"><button class="folder-shortcut folder-general ${!activeFolder?'selected':''}" onclick="setProjectFolderFilter('${pid}','')"><span class="folder-symbol">📂</span><strong>General</strong><span class="folder-count">${ms.length}</span></button><button class="folder-shortcut folder-unassigned ${activeFolder==='__none__'?'selected':''}" onclick="setProjectFolderFilter('${pid}','__none__')"><span class="folder-symbol">📁</span><strong>Sin carpeta</strong><span class="folder-count">${looseCount}</span></button>${folders.map(f=>{const count=ms.filter(m=>m.folderId===f.id).length;return `<div class="folder-shortcut-wrap"><button class="folder-shortcut ${activeFolder===f.id?'selected':''}" style="--folder-color:${safe(f.color||'#c99b4b')}" onclick="setProjectFolderFilter('${pid}','${f.id}')"><span class="folder-symbol">📁</span><strong>${safe(f.name)}</strong><span class="folder-count">${count}</span></button><button class="folder-shortcut-edit" onclick="event.stopPropagation();editProjectMissionFolder('${f.id}')" aria-label="Editar carpeta">✎</button></div>`}).join('')}</div>`;
 const loose=visibleMs;
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="showCore('${p.core}')">← ${cname(p.core)}</button><p class="eyebrow">${cname(p.core)} / PROYECTO</p><div class="headline"><h1>${safe(p.name)}</h1><button class="edit-icon" onclick="editProject('${p.id}')">✎</button></div><p class="muted">${safe(p.description||'')}</p>${p.completedAt?`<span class="tag">PROYECTO TERMINADO · ${fmt(p.completedAt)}</span>`:''}
 <div class="row between section-head"><div><h2>Misiones</h2><p class="small">Dividí el proyecto en partes de trabajo.</p></div><button class="btn" onclick="newMission('${p.id}')">＋ Misión</button></div>
 <div class="project-folder-create"><button class="btn secondary" onclick="newProjectMissionFolder('${p.id}')">📁 Crear carpeta</button></div>
 ${folderShortcuts}
 <div id="projectBulkActions" class="project-bulk-actions"><span id="selectedMissionCount" class="small"></span><button class="btn" onclick="moveSelectedMissions('${p.id}')">Meter en carpeta</button><button class="btn ghost" onclick="selectedMissionIds.clear();openProject('${p.id}')">Cancelar selección</button></div>
 <div class="mission-grid">${loose.map(m=>missionCard(m)).join('')||'<div class="empty">'+(activeFolder?'Esta carpeta no tiene misiones.':'No hay misiones pendientes.')+'</div>'}</div>${doneMs.length?`<details class="mission-completed-list"><summary><span>Misiones completadas</span><span class="completed-count">${doneMs.length}</span><span class="completed-more">⋯</span></summary><div class="completed-missions">${doneMs.map(m=>`<div class="item row between"><div><b>${safe(m.name)}</b><div class="small">Completada · ${fmt(m.completedAt||m.doneAt||Date.now())}</div></div><button class="btn secondary" onclick="openMission('${m.id}')">Ver</button></div>`).join('')}</div></details>`:''}
 ${oldTasks.length?`<div class="panel"><h3>Tareas de la misión sin asignar</h3><p class="small">Estas tareas ya existían en el proyecto. Podés mantenerlas acá o asignarlas a una misión más adelante.</p>${oldTasks.map(t=>taskRow(t)).join('')}</div>`:''}
 <div class="completion-actions">${p.completedAt?`<span class="tag">TERMINADO · ${fmt(p.completedAt)}</span>`:''}<button class="btn ${p.completedAt?'secondary':''}" onclick="toggleProjectComplete('${p.id}')">${p.completedAt?'↶ Reabrir proyecto':'✓ Finalizar proyecto'}</button></div><div class="actions"><button class="btn ghost" onclick="editProject('${p.id}')">Editar proyecto</button><button class="btn ghost" onclick="archiveProject('${p.id}')">Archivar</button><button class="btn danger" onclick="deleteProject('${p.id}')">Eliminar</button></div>`;
 updateBulkMissionActions();
}
function missionCard(m){
 const ts=missionTasks(m.id),done=ts.filter(t=>t.done).length;
 const siblings=data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0));const idx=siblings.findIndex(x=>x.id===m.id),number=idx+1;
 const taskProgress=ts.length?`<div class="small mission-task-count">${done}/${ts.length} tareas completadas</div>`:'';
 const f=projectMissionFolders(m.projectId).find(x=>x.id===m.folderId);
 const folderName=f?f.name:'General';
 const folderColor=f?(f.color||'#c99b4b'):'#91a8b2';
 const folderLabel=`<span class="mission-folder-label" style="--folder-color:${safe(folderColor)}"><i class="folder-dot"></i>${safe(folderName)}</span>`;
 return `<div class="mission-card" role="button" tabindex="0" aria-label="Abrir misión ${safe(m.name)}" onclick="openMission('${m.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMission('${m.id}')}"><div class="mission-line"><div class="mission-index"><div class="mission-number-tile"><span class="number">${number}</span></div>${missionPriorityBadge(m)}</div><div class="mission-main"><h3>${safe(m.name)} ${m.completedAt?'✓':''}</h3>${m.description?`<p class="small">${safe(m.description)}</p>`:''}${taskProgress}${folderLabel}</div><div class="mission-tools"><input class="mission-select" type="checkbox" aria-label="Seleccionar misión ${safe(m.name)}" title="Seleccionar misión" ${selectedMissionIds.has(m.id)?'checked':''} onclick="event.stopPropagation()" onchange="toggleMissionSelection('${m.id}',this.checked)"><button onclick="event.stopPropagation();moveMission('${m.id}',-1)" ${idx===0?'disabled':''} aria-label="Subir misión">↑</button><button onclick="event.stopPropagation();moveMission('${m.id}',1)" ${idx===siblings.length-1?'disabled':''} aria-label="Bajar misión">↓</button><button onclick="event.stopPropagation();editMission('${m.id}')" aria-label="Editar misión">✎</button></div></div></div>`;
}

function moveMission(mid,delta){const m=mission(mid);if(!m)return;const list=data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0));const i=list.findIndex(x=>x.id===mid),j=i+delta;if(j<0||j>=list.length)return;const [moved]=list.splice(i,1);list.splice(j,0,moved);list.forEach((x,n)=>x.order=n);save();openProject(m.projectId)}
function openMission(mid){
 const m=mission(mid);if(!m)return;currentMission=mid;const p=project(m.projectId);if(!p)return;tab='mission';touchCore(p.core,p.id,mid);
 const ts=missionTasks(mid),isDone=!!(m.completedAt||m.done),folders=(data.missionFolders||[]).filter(f=>f.missionId===mid);
 const folderTasks=folders.map(f=>{const list=ts.filter(t=>t.folderId===f.id);return `<section class="mission-folder" style="--folder-color:${safe(f.color||'#c99b4b')}"><div class="folder-heading"><span class="folder-symbol">📁</span><strong>${safe(f.name)}</strong><span class="small">${list.filter(t=>t.done).length}/${list.length}</span><div class="folder-tools"><button onclick="editMissionFolder('${f.id}')" aria-label="Editar carpeta">✎</button><button onclick="deleteMissionFolder('${f.id}')" aria-label="Eliminar carpeta">×</button></div></div>${list.map(t=>taskRow(t)).join('')||'<div class="folder-empty">Carpeta vacía. Agregá una tarea y elegí esta carpeta.</div>'}</section>`}).join('');
 const loose=ts.filter(t=>!t.folderId||!folders.some(f=>f.id===t.folderId));
 document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="openProject('${p.id}')">← ${safe(p.name)}</button><p class="eyebrow">${cname(p.core)} / ${safe(p.name)}</p><div class="mission-hero ${isDone?'status-done':''}"><div class="mission-number-tile"><span class="number">${data.missions.filter(x=>x.projectId===m.projectId&&!(x.completedAt||x.done)).slice().sort((a,b)=>(a.order??0)-(b.order??0)).findIndex(x=>x.id===m.id)+1}</span><span class="word">MISIÓN</span>${missionPriorityBadge(m)}</div><div class="headline"><h1>${safe(m.name)}</h1><button class="edit-icon" onclick="editMission('${m.id}')">✎</button></div>${m.description?`<p class="muted">${safe(m.description)}</p>`:''}${isDone?`<span class="tag">COMPLETADA · ${fmt(m.completedAt)}</span>`:''}</div>
 <div class="row between section-head"><div><h2>Tareas de la misión</h2><p class="small">${ts.filter(t=>!t.done).length} pendientes · ${ts.filter(t=>t.done).length} completadas</p></div><button class="btn" onclick="newTask('${p.id}','${m.id}')">＋ Tarea de la misión</button></div>

 <div class="task-list">${ts.map(t=>taskRow(t)).join('')||'<div class="empty">Todavía no hay tareas de la misión.</div>'}</div>
 <div class="completion-actions">${calendarIsAvailable()?`<button class="btn secondary" onclick="calScheduleMission('${m.id}')">▦ Agendar en calendario</button>`:``}<button class="btn ${isDone?'secondary':''}" onclick="toggleMissionComplete('${m.id}')">${isDone?'↶ Reabrir misión':'✓ Marcar misión completada'}</button><button class="btn ghost" onclick="moveMissionToFolder('${m.id}')">Mover a carpeta</button><button class="btn ghost" onclick="editMission('${m.id}')">Editar misión</button><button class="btn danger" onclick="deleteMission('${m.id}')">Eliminar misión</button></div>`;
}
function newMissionFolder(mid){modal(`<h2>Nueva carpeta</h2><label>Nombre de la carpeta</label><input id="mfName" placeholder="Ej. Investigación, Producción, Pendientes"><label>Color de la carpeta</label><input id="mfColor" type="color" value="#c99b4b"><div class="actions"><button class="btn" onclick="saveMissionFolder('${mid}')">Crear carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveMissionFolder(mid){const name=document.getElementById('mfName').value.trim();if(!name)return alert('Escribí un nombre para la carpeta.');if(!Array.isArray(data.missionFolders))data.missionFolders=[];data.missionFolders.push({id:uid(),missionId:mid,name,color:document.getElementById('mfColor').value||'#c99b4b',created:Date.now()});if(!save())return;closeModal();openMission(mid)}
function editMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;modal(`<h2>Editar carpeta</h2><label>Nombre</label><input id="emfName" value="${safe(f.name)}"><label>Color</label><input id="emfColor" type="color" value="${safe(f.color||'#c99b4b')}"><div class="actions"><button class="btn" onclick="updateMissionFolder('${fid}')">Guardar cambios</button><button class="btn danger" onclick="deleteMissionFolder('${fid}')">Eliminar carpeta</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;f.name=document.getElementById('emfName').value.trim()||f.name;f.color=document.getElementById('emfColor').value||f.color;if(!save())return;closeModal();openMission(f.missionId)}
function deleteMissionFolder(fid){const f=(data.missionFolders||[]).find(x=>x.id===fid);if(!f)return;if(!confirm('¿Eliminar esta carpeta? Las tareas se conservarán y quedarán sin carpeta.'))return;data.tasks.forEach(t=>{if(t.folderId===fid)delete t.folderId});data.missionFolders=data.missionFolders.filter(x=>x.id!==fid);if(!save())return;closeModal();openMission(f.missionId)}

function taskRow(t){const subs=Array.isArray(t.subtasks)?t.subtasks:[];return `<div class="task-row" id="task-${t.id}"><div class="task-main"><label><input class="check" type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="${t.done?'completed':''}">${safe(t.title)}</span></label>${subs.length?`<div class="subtask-list">${subs.map((s,i)=>`<div class="subtask"><input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${t.id}',${i})"><span class="${s.done?'completed':''}">${safe(s.title)}</span></div>`).join('')}</div>`:''}<div class="small">${t.priority||'Media'}</div></div><div class="task-actions"><button class="edit-icon" onclick="editTask('${t.id}')" aria-label="Editar tarea">✎</button></div></div>`}
function historyPage(){
 const completedTasks=data.tasks.filter(t=>t.done),completedMissions=data.missions.filter(m=>!!(m.completedAt||m.done)),completedProjects=data.projects.filter(p=>!!p.completedAt);

 <div class="panel"><h2>Proyectos terminados</h2>${completedProjects.length?completedProjects.slice().sort((a,b)=>b.completedAt-a.completedAt).map(p=>`<div class="item row between"><div><b>${safe(p.name)}</b><div class="small">${safe(coreName(p.core))} · ${fmt(p.completedAt)}</div></div><button class="btn secondary" onclick="openArchivedProject('${p.id}')">Ver</button></div>`).join(''):'<p class="muted">Todavía no terminaste proyectos.</p>'}</div>
 <details class="panel completion-log"><summary><span>Registro de finalizaciones</span><span class="completion-log-more">⋯</span></summary><div class="completion-log-body">${events.length?`<div class="completion-log-actions"><button class="text-button danger-text" onclick="clearCompletionLog()">Borrar todo el registro</button></div>${events.map(e=>`<div class="event-row completion-event"><div><b>${e.action==='reopened'?'Reabierto':'Completado'}: ${safe(e.label)}</b><div class="small">${e.kind==='task'?'Tarea de la misión':e.kind==='mission'?'Misión':'Proyecto'} · ${fmt(e.at)}</div></div><button class="edit-icon completion-delete" onclick="deleteCompletionEvent('${e.id}')" aria-label="Eliminar registro" title="Eliminar registro">×</button></div>`).join('')}`:'<p class="muted">Cuando completes tareas, misiones o proyectos, aparecerán acá.</p>'}</div></details>
 <div class="panel"><h2>Cómo funciona HOY</h2><p class="small">Una guía rápida para organizarte.</p><button class="btn secondary" onclick="showTutorial()">Ver tutorial</button></div><div class="panel"><h2>Copias de seguridad</h2><p class="small">Tus datos se guardan en este navegador. Exportá una copia periódicamente.</p><button class="btn secondary" onclick="exportData()">Descargar copia JSON</button><label>Restaurar copia</label><input type="file" accept="application/json" onchange="importData(event)"></div>
 <div class="version-history"><p class="small version-history-label">VERSIÓN DE LA APLICACIÓN</p><div class="version-history-line"><span>${APP_VERSION}</span><span class="version-history-date">· ${APP_RELEASE_DATE}</span></div></div>`;
}

function showTutorial(){modal(`<h2>Cómo funciona HOY</h2><p><b>Núcleos:</b> organizá las áreas de tu vida.</p><p><b>Proyectos:</b> agrupá objetivos relacionados con un núcleo.</p><p><b>Misiones:</b> dividí cada proyecto en etapas.</p><p><b>Tareas de la misión:</b> convertí cada misión en acciones concretas.</p><p><b>Ideas:</b> capturá pensamientos y convertí los que quieras desarrollar en misiones.</p><p><b>Historial:</b> consultá lo que terminaste y tu progreso.</p><hr><p><b>Por ejemplo, tenés un proyecto de una panadería.</b></p><div class="tutorial-example"><div class="tutorial-core"><div class="tutorial-task-label">Núcleo</div><h3>🏪 Panadería</h3><div class="tutorial-project"><div class="tutorial-task-label">Proyecto</div><b>Restauración de la panadería</b><div class="tutorial-mission"><div class="tutorial-task-label">Misión</div><b>Pintar paredes</b><div class="tutorial-task-label">Tareas de la misión</div><div class="tutorial-task">Contratar pintor</div><div class="tutorial-task">Comprar pintura</div></div><div class="tutorial-mission"><div class="tutorial-task-label">Misión</div><b>Cambiar piso</b><div class="tutorial-task-label">Tareas de la misión</div><div class="tutorial-task">Contratar quién lo coloca</div><div class="tutorial-task">Tomar medidas</div><div class="tutorial-task">Ir a comprar los materiales</div></div></div></div></div><div class="actions"><button class="btn" onclick="closeModal()">Entendido</button></div>`)}
function openArchivedProject(pid){const p=project(pid);if(!p)return;const was=p.archived;p.archived=false;openProject(pid);p.archived=was;}

function modal(content){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${content}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function newProject(core=currentCore||'tomas'){modal(`<h2>Nuevo proyecto</h2><label>Núcleo</label><select id="pCore">${activeCores().map(c=>`<option value="${c[0]}" ${c[0]===core?'selected':''}>${safe(coreName(c[0]))}</option>`).join('')}</select><label>Nombre</label><input id="pName" placeholder="Ej. Videoclip nuevo"><label>Descripción</label><textarea id="pDesc" placeholder="¿De qué se trata?"></textarea><div class="actions"><button class="btn" onclick="saveProject()">Crear proyecto</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveProject(){const name=document.getElementById('pName').value.trim();if(!name)return alert('Escribí un nombre.');const p={id:uid(),core:document.getElementById('pCore').value,name,description:document.getElementById('pDesc').value.trim(),created:Date.now(),archived:false,last:'',next:'',lastAt:null};data.projects.push(p);save();closeModal();currentCore=p.core;renderCore()}
function editProject(pid){const p=project(pid);modal(`<h2>Editar proyecto</h2><label>Nombre</label><input id="eName" value="${safe(p.name)}"><label>Descripción</label><textarea id="eDesc">${safe(p.description)}</textarea><div class="actions"><button class="btn" onclick="updateProject('${pid}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function updateProject(pid){const p=project(pid);p.name=document.getElementById('eName').value.trim()||p.name;p.description=document.getElementById('eDesc').value;save();closeModal();openProject(pid)}
let selectedMissionIds=new Set();

}

function moveMissionToFolder(mid){

 modal(`<h2>Meter en carpeta</h2><p class="small">Elegí dónde querés guardar esta misión.</p><label>Carpeta</label><select id="moveMissionFolder">${missionFolderOptions(m.projectId,m.folderId||'')}</select><div class="actions"><button class="btn" onclick="applyMoveMissionToFolder('${mid}')">Confirmar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`);
